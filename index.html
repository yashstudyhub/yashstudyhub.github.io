// ---- Direct File Upload for Web Admin Panel (Images & PDFs -> free GitHub ysh-images + jsDelivr; Videos -> Firebase Storage if Blaze enabled) ----
const GH_UP={owner:'yashpcmishra-cyber',repo:'ysh-images',branch:'main',key:'ysh_gh_tok'};
const ghTok=()=>String(ls.get(GH_UP.key)||'').trim();
function ghTokSet(v){try{v=String(v||'').trim();if(v)localStorage.setItem(GH_UP.key,v);else localStorage.removeItem(GH_UP.key)}catch(e){}}
function ghReadB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const s=String(r.result||''),i=s.indexOf(',');res(i>=0?s.slice(i+1):s)};r.onerror=()=>rej(new Error('Could not read file'));r.readAsDataURL(file)})}
async function admGhUpload(file,prefix){
 let tok=ghTok();
 if(!tok){
  const entered=prompt('First time setup: paste your GitHub IMAGE_UPLOAD_TOKEN (fine-grained token for ysh-images repo).\nयह केवल आपके इस ब्राउज़र में सेव रहेगा — Firebase में नहीं जाएगा।');
  if(!entered||!entered.trim())throw new Error('Upload cancelled — GitHub token not set.');
  tok=entered.trim();ghTokSet(tok);
 }
 if(file.size>24*1024*1024)throw new Error('File is larger than 24 MB. For bigger files, upload to Google Drive and paste the link. / 24 MB से बड़ी फ़ाइल के लिए Google Drive लिंक डालें।');
 const b64=await ghReadB64(file);
 const rawExt=(file.name&&file.name.includes('.'))?file.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,''):'bin';
 const ext=rawExt||(prefix=='pdf'?'pdf':'jpg');
 const path=`uploads/${prefix}_${Date.now()}.${ext}`;
 const resp=await fetch(`https://api.github.com/repos/${GH_UP.owner}/${GH_UP.repo}/contents/${path}`,{
  method:'PUT',
  headers:{'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
  body:JSON.stringify({message:`Upload ${prefix} via Yash Study Hub Web Admin`,content:b64,branch:GH_UP.branch})
 });
 if(!resp.ok){
  if(resp.status===401||resp.status===403)throw new Error('GitHub token rejected (expired, wrong, or missing Contents Read/Write permission on ysh-images). Update it in Admin > Branding.');
  if(resp.status===404)throw new Error(`Repo ${GH_UP.owner}/${GH_UP.repo} not found or token has no access.`);
  const tx=await resp.text().catch(()=>'');
  throw new Error(`Upload failed (${resp.status}): ${tx.slice(0,140)}`);
 }
 const j=await resp.json().catch(()=>({}));
 const sha=j&&j.commit&&j.commit.sha?j.commit.sha:GH_UP.branch;
 return `https://cdn.jsdelivr.net/gh/${GH_UP.owner}/${GH_UP.repo}@${sha}/${path}`;
}
async function admStorageUpload(file,folder){
 if(!firebase.storage)throw new Error('Firebase Storage SDK is not loaded. Use a YouTube/Drive link instead.');
 const safe=(file.name||'file').replace(/[^a-zA-Z0-9._-]/g,'_');
 const ref=firebase.storage().ref().child(`${folder}/${Date.now()}_${safe}`);
 try{await ref.put(file);return await ref.getDownloadURL()}
 catch(e){
  const code=(e&&e.code)||'';
  if(code.includes('bucket-not-found')||code.includes('project-not-found')||code.includes('unauthorized')||code.includes('unknown')){
   throw new Error('Firebase Storage is not enabled (needs Blaze plan). Upload video on YouTube (Unlisted) and paste the YouTube link here. / वीडियो YouTube (Unlisted) पर अपलोड करके लिंक पेस्ट करें।');

 }
}

async function apCpGo(){const C=ACP,dest=[...new Set(C.sel)];if(!dest.length)return;admClose();toast('Copying “'+C.name+'” …',8000);

s","Roots of ax² + bx + c = 0?","ax² + bx + c = 0 के मूल?","x = [−b ± √(b² − 4ac)] / 2a.","x = [−b ± √(b² − 4ac)] / 2a।"],["m12","maths","nth term and sum of an AP?","AP का nवाँ पद और योग?","aₙ = a + (n−1)d. Sₙ = n/2 × [2a + (n−1)d].","aₙ = a + (n−1)d। Sₙ = n/2 × [2a + (n−1)d]।"],["n01","english","One word: 'One who knows everything'","एक शब्द: 'जो सब कुछ जानता हो'","Omniscient.","सर्वज्ञ (Omniscient)।"],["n02","english","One word: 'Study of birds'","एक शब्द: 'पक्षियों का अध्ययन'","Ornithology.","पक्षी विज्ञान (Ornithology)।"],["n03","english","One word: 'Fear of heights'","एक शब्द: 'ऊँचाई से डर'","Acrophobia.","एक्रोफोबिया (Acrophobia)।"],["n04","english","One word: 'A person who loves books'","एक शब्द: 'किताबों से प्यार करने वाला'","Bibliophile.","पुस्तक-प्रेमी (Bibliophile)।"],["n05","english","One word: 'A medicine that cures all diseases'","एक शब्द: 'सब रोगों की दवा'","Panacea.","रामबाण (Panacea)।"],["n06","english","One word: 'Speaking in one's sleep'","एक शब्द: 'नींद में बोलना'","Somniloquy.","नींद में बड़बड़ाना (Somniloquy)।"],["n07","english","One word: 'Killing of one's own brother'","एक शब्द: 'अपने भाई की हत्या'","Fratricide.","भ्रातृहत्या (Fratricide)।"],["n08","english","One word: 'A government by the rich'","एक शब्द: 'अमीरों का शासन'","Plutocracy.","धनिकतंत्र (Plutocracy)।"]],FLCAT={"polity":["Polity","राजव्यवस्था","🏛️"],"geo":["Geography","भूगोल","🌏"],"history":["History","इतिहास","📜"],"science":["Science","विज्ञान","🔬"],"economy":["Economy","अर्थव्यवस्था","💰"],"maths":["Maths Formulas","गणित सूत्र","➗"],"english":["One-Word / English","एक शब्द / अंग्रेज़ी","📖"]};

const fcKnown=()=>new Set(J.get('flashKnown',[]));

window.FC=window.FC||{cat:'all',deck:[],flip:false};
const fcIn=c=>FC.cat=='all'||c[1]==FC.cat;
function fcBuild(){const k=fcKnown(),d=FLC.filter(c=>fcIn(c)&&!k.has(c[0]));for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}FC.deck=d;FC.flip=false}
function fcInit(){fcBuild();fcDraw()}
function fcDraw(){const e=document.getElementById('fcb');if(!e)return;const k=fcKnown(),tot=FLC.filter(fcIn).length,done=FLC.filter(c=>fcIn(c)&&k.has(c[0])).length,cats=['all',...Object.keys(FLCAT)];
 const chip=c=>{const v=FLCAT[c],n=c=='all'?'All / सभी':v[0]+' / '+v[1],cnt=c=='all'?FLC.length:FLC.filter(x=>x[1]==c).length;return `<a class="chip ${FC.cat==c?'on':''}" onclick="FC.cat='${c}';fcInit()">${c=='all'?'🃏':v[2]} ${esc(n)} (${cnt})</a>`};
 let h=`<div class="chips" style="margin-top:12px">${cats.map(chip).join('')}</div><div class="fcbar"><i style="width:${tot?Math.round(done/tot*100):0}%"></i></div><small class="mu" style="display:block;margin-bottom:14px">${done} / ${tot} learned • ${FC.deck.length} left<br>${done} / ${tot} याद • ${FC.deck.length} बाकी</small>`;
 if(!FC.deck.length)h+=`<div class="card" style="text-align:center;padding:20px"><div style="font-size:40px">🎉</div><b style="display:block;margin:8px 0 6px">All cards learned in this topic!<br>इस विषय के सभी कार्ड याद हो गए!</b><small class="mu">Pick another topic or reset.<br>दूसरा विषय चुनें या रीसेट करें।</small><div style="margin-top:12px"><button class="s" onclick="fcReset()">↺ Reset / रीसेट</button></div></div>`;
 else{const c=FC.deck[0],v=FLCAT[c[1]];
  h+=`<div class="fcc ${FC.flip?'on':''}" onclick="FC.flip=!FC.flip;fcDraw()"><div class="t">${v?v[2]+' '+esc(v[0])+' / '+esc(v[1]):''}</div><div class="k">${FC.flip?'ANSWER / उत्तर':'QUESTION / प्रश्न'}</div><div class="en">${esc(FC.flip?c[4]:c[2])}</div><div class="hi">${esc(FC.flip?c[5]:c[3])}</div><div class="h">${FC.flip?'Tap to see the question / सवाल देखने के लिए दबाएँ':'Tap card to flip / पलटने के लिए दबाएँ'}</div></div>`
  +`<div style="margin-top:14px">`+(FC.flip?`<div class="row" style="flex-wrap:nowrap"><button class="s" style="flex:1" onclick="fcAgain()">Again / फिर से</button><button class="p" style="flex:1" onclick="fcGot()">Got it ✓ / याद</button></div>`:`<button class="p" style="width:100%" onclick="FC.flip=true;fcDraw()">Show answer / जवाब देखें</button>`)+`</div>`}
 e.innerHTML=h}
function fcGot(){if(!FC.deck.length)return;const c=FC.deck.shift(),k=fcKnown();FC.flip=false;if(!k.has(c[0])){k.add(c[0]);J.set('flashKnown',[...k]);xpAdd(2)}fcDraw()}
function fcAgain(){if(!FC.deck.length)return;FC.deck.push(FC.deck.shift());FC.flip=false;fcDraw()}
function fcReset(){if(!confirm('Reset progress? / रीसेट करें?\nAll cards will come back.\nसभी कार्ड फिर से आ जाएँगे।'))return;J.set('flashKnown',[]);if(document.getElementById('fcb'))fcInit();else route()}

<script>

(function () {

  try {
    function syncNetBar() {
      var id = 'yshOffBar', bar = document.getElementById(id);
      if (navigator.onLine) { if (bar) bar.remove(); return; }

        bar = document.createElement('div');

        bar.style.cssText = 'background:#334155;color:#fff;padding:6px 12px;font-size:12px;text-align:center;position:sticky;top:0;z-index:85';

        document.body.insertBefore(bar, document.body.firstChild);
      }
    }
    window.addEventListener('online', syncNetBar);
    window.addEventListener('offline', syncNetBar);
    if (!navigator.onLine) syncNetBar();

  // 2) Bookmark reminder (shows again only after 30 days once closed)

      '@media(min-width:900px){#yshBm{bottom:16px;left:auto;right:16px;margin:0}}';
    document.head.appendChild(st);

    function el(tag, cls, txt) { var n = document.createElement(tag); if (cls) n.className = cls; if (txt) n.textContent = txt; return n; }
    function show() {

      var x = el('button', 'x', '✕'); x.type = 'button'; x.setAttribute('aria-label', 'Close'); x.onclick = close;
      bar.appendChild(ok); bar.appendChild(x);
