/* ---- nav tap fix: no blue tap overlay / selection on navy bars ---- */
html{-webkit-tap-highlight-color:transparent}
nav.bn,nav.bn *,.side,.side *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
nav.bn a,.side a{outline:none;transition:background .15s ease,color .15s ease;border-radius:12px}
nav.bn a,nav.bn a:visited,nav.bn a:focus,nav.bn a:active{color:#b4bbea}
nav.bn a.on,nav.bn a.on:visited,nav.bn a.on:focus,nav.bn a.on:active{color:var(--yel)}
nav.bn a:active{background:rgba(255,255,255,.14)}
nav.bn a.on{background:rgba(255,255,255,.12)}
nav.bn a.on,nav.bn a.on *,nav.bn a:active.on *{color:#ffff29!important}
nav.bn a:active,nav.bn a:active *{color:#ffff29}
.side a.on *{color:#ffff29}
nav.bn a::selection,nav.bn a *::selection,.side a::selection,.side a *::selection{background:transparent;color:inherit}
.side a,.side a:visited,.side a:focus,.side a:active{color:#fff}
.side a.on,.side a.on:visited,.side a.on:focus,.side a.on:active{color:var(--yel)}
.side a:active{background:rgba(255,255,255,.2)}
a,button,.tile,.stool,.card,.chip,.opt,.badge,.pn{-webkit-tap-highlight-color:transparent}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const _SUP_MAP={'\u2070':'0','\u00B9':'1','\u00B2':'2','\u00B3':'3','\u2074':'4','\u2075':'5','\u2076':'6','\u2077':'7','\u2078':'8','\u2079':'9','\u207A':'+','\u207B':'-','\u207D':'(','\u207E':')'};
const _MATH_RE=/[\^√∛\u00B2\u00B3\u00B9\u2070\u2074-\u2079\u207A\u207B\u207D\u207E*\/]|>=|<=|!=|\b(?:sqrt|cbrt)\s*\(| - /i;
function _mBal(s,openIdx){
 let d=0;
 for(let i=openIdx;i<s.length;i++){
  if(s[i]==='(')d++;
  else if(s[i]===')'){d--;if(d===0)return i;}
 }
 return -1;
}
function _mNorm(s){
 return s
  .replace(/>=/g,'≥').replace(/<=/g,'≤').replace(/!=/g,'≠')
  .replace(/([\d\)\u00B2\u00B3\u00B9%])\s*\*\s*([\d\(√∛a-zA-Z?])/g,'$1 × $2')
  .replace(/([\d\)\u00B2\u00B3\u00B9%])\s+\/\s+([\d\(√∛?])/g,'$1 ÷ $2')
  .replace(/([\d\)\u00B2\u00B3\u00B9%])\s+-\s+([\d\(√∛?])/g,'$1 − $2');
}
function _mDen(s,idx){
 if(idx>=s.length)return null;
 if(s[idx]==='('){
  const e=_mBal(s,idx);
  if(e>idx+1&&s[e+1]!=='/')return {raw:s.slice(idx+1,e),end:e+1};
  return null;
 }
 const nm=s.slice(idx).match(/^(\d+(?:\.\d+)?)(?![\/\d])/);
 if(nm)return {raw:nm[1],end:idx+nm[1].length};
 const vm=s.slice(idx).match(/^([a-zA-Z])(?![a-zA-Z\/\d])/);
 if(vm)return {raw:vm[1],end:idx+1,isVar:true};
 return null;
}
function _mParse(s,depth){
 if(!s)return '';
 if(depth>4)return esc(s);
 let out='',i=0,n=s.length;
 while(i<n){
  // 1. cbrt(...) / sqrt(...)
  const fn=s.slice(i).match(/^(cbrt|sqrt)\s*\(/i);
  if(fn&&(i===0||!/[a-zA-Z0-9_]/.test(s[i-1]))){
   const op=i+fn[0].length-1,cl=_mBal(s,op);
   if(cl>op){
    const isC=fn[1].toLowerCase()==='cbrt';
    out+=`<span class="mr"><span class="msym">${isC?'<span class="mcube">3</span>':''}√</span><span class="mrad">${_mParse(s.slice(op+1,cl),depth+1)}</span></span>`;
    i=cl+1;continue;
   }
  }
  // 2. √ / ∛
  if(s[i]==='√'||s[i]==='∛'){
   const isC=s[i]==='∛';
   let j=i+1;while(j<n&&s[j]===' ')j++;
   if(s[j]==='('){
    const cl=_mBal(s,j);
    if(cl>j){
     out+=`<span class="mr"><span class="msym">${isC?'<span class="mcube">3</span>':''}√</span><span class="mrad">${_mParse(s.slice(j+1,cl),depth+1)}</span></span>`;
     i=cl+1;continue;
    }
   }
   const rm=s.slice(j).match(/^(\d+(?:\.\d+)?|[a-zA-Z](?![a-zA-Z]))/);
   if(rm){
    out+=`<span class="mr"><span class="msym">${isC?'<span class="mcube">3</span>':''}√</span><span class="mrad">${esc(rm[1])}</span></span>`;
    i=j+rm[1].length;continue;
   }
  }
  // 3. Parenthesized numerator fraction: (...)/den
  if(s[i]==='('){
   const cl=_mBal(s,i);
   if(cl>i+1&&s[cl+1]==='/'){
    const den=_mDen(s,cl+2);
    if(den){
     out+=`<span class="mf"><span class="mn">${_mParse(s.slice(i+1,cl),depth+1)}</span><span class="md">${_mParse(den.raw,depth+1)}</span></span>`;
     i=den.end;continue;
    }
   }
  }
  // 4. Numeric or single-var numerator fraction: num/den (skip dates dd/mm/yyyy and words PO/Clerk, km/hr)
  if((i===0||!/[a-zA-Z0-9_\/.]/.test(s[i-1]))){
   const nf=s.slice(i).match(/^(\d+(?:\.\d+)?)\//);
   if(nf){
    const den=_mDen(s,i+nf[0].length);
    if(den){
     out+=`<span class="mf"><span class="mn">${esc(nf[1])}</span><span class="md">${_mParse(den.raw,depth+1)}</span></span>`;
     i=den.end;continue;
    }
   }
   const vf=s.slice(i).match(/^([xyzabcpqrnk])\//);
   if(vf){
    const den=_mDen(s,i+2);
    if(den&&(!den.isVar||/^[xyzabcpqrnk]$/.test(den.raw))){
     out+=`<span class="mf"><span class="mn">${esc(vf[1])}</span><span class="md">${_mParse(den.raw,depth+1)}</span></span>`;
     i=den.end;continue;
    }
   }
  }
  // 5. Caret powers: ^(...) or ^-2 or ^n
  if(s[i]==='^'){
   if(s[i+1]==='('){
    const cl=_mBal(s,i+1);
    if(cl>i+1){
     out+=`<sup class="msup">${_mParse(s.slice(i+2,cl),depth+1)}</sup>`;
     i=cl+1;continue;
    }
   }
   const pm=s.slice(i+1).match(/^([+-]?\d+(?:\.\d+)?|[a-zA-Z](?![a-zA-Z]))/);
   if(pm){
    out+=`<sup class="msup">${esc(pm[1])}</sup>`;
    i+=1+pm[1].length;continue;
   }
  }
  // 6. Unicode superscripts: ² ³ ⁴ ...
  if(_SUP_MAP[s[i]]){
   let sup='';
   while(i<n&&_SUP_MAP[s[i]]){sup+=_SUP_MAP[s[i]];i++;}
   out+=`<sup class="msup">${esc(sup)}</sup>`;
   continue;
  }
  out+=esc(s[i]);i++;
 }
 return out;
}

const XT=()=>J.get('examTracker',[]);

const xtUntil=d=>{const n=new Date();return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))/DAY)};
function xtNext(e){let b=null;const f=xtDay(e.f),x=xtDay(e.e);if(f&&!e.a){const n=xtUntil(f);if(n>=0)b=n}if(x){const n=xtUntil(x);if(n>=0&&(b===null||n<b))b=n}return b}
const xtSorted=()=>XT().slice().sort((a,b)=>{const x=xtNext(a),y=xtNext(b);return x!==null&&y!==null?x-y:x!==null?-1:y!==null?1:a.n.toLowerCase().localeCompare(b.n.toLowerCase())});
const xtFmt=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
function xtLeft(d){const n=xtUntil(d);return n==0?'Today! / आज!':n==1?'1 day left / 1 दिन बाकी':n+' days left / '+n+' दिन बाकी'}
function xtSummary(){const L=XT();let best=null;L.forEach(e=>{const f=xtDay(e.f),x=xtDay(e.e);if(f&&!e.a){const n=xtUntil(f);if(n>=0&&(!best||n<best.d))best={n:e.n,d:n}}if(x){const n=xtUntil(x);if(n>=0&&(!best||n<best.d))best={n:e.n,d:n}}});return {count:L.length,near:best}}

const _stripImg=s=>String(s||'').replace(/^IMG\s*[:=]\s*https?:\/\/\S+\s*$/gim,'').trim();
const qt=(q,k,hi)=>{if(!q)return '';const e=_stripImg(q[k]),h=_stripImg(q[k+'Hi']);return hi?(h||e):(e||h)};
const qOpts=(q,hi)=>{const a=Array.isArray(q?.options)?q.options:[],h=Array.isArray(q?.optionsHi)?q.optionsHi:[];const hOk=h.length===a.length&&h.length>0&&h.every(s=>String(s||'').trim()),aOk=a.length>0&&a.every(s=>String(s||'').trim());return hi?(hOk?h:a):(aOk?a:h)};
const diNormUrl=u=>{let s=String(u||'').trim();if(!s)return '';const gh=s.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/i);if(gh)return `https://cdn.jsdelivr.net/gh/${gh[1]}/${gh[2]}@${gh[3]}/${gh[4]}`;const dr=s.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/i);if(dr)return `https://drive.google.com/thumbnail?id=${dr[1]}&sz=w1600`;return /^https?:\/\//i.test(s)?s:''};
const diUrl=q=>{if(!q)return '';let u=diNormUrl(q.passageImage||q.imageUrl||q.image||q.diImage||q.graphImage||q.img||'');if(!u){for(const f of [q.passage,q.passageHi,q.text,q.textHi]){if(typeof f=='string'){const m=f.match(/^IMG\s*[:=]\s*(https?:\/\/\S+)/im);if(m){u=diNormUrl(m[1]);if(u)break}}}}return u};
function diFallback(im){if(!im)return;const u=im.getAttribute('src')||'';if(!im.dataset.fb){const jsd=u.match(/^https?:\/\/cdn\.jsdelivr\.net\/gh\/([^/@]+)\/([^/@]+)@([^/]+)\/(.+)$/i);if(jsd){im.dataset.fb='1';im.src=`https://raw.githubusercontent.com/${jsd[1]}/${jsd[2]}/${jsd[3]}/${jsd[4]}`;return}const raw=u.match(/^https?:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)$/i);if(raw){im.dataset.fb='1';im.src=`https://cdn.jsdelivr.net/gh/${raw[1]}/${raw[2]}@${raw[3]}/${raw[4]}`;return}}if(im.parentElement)im.parentElement.innerHTML='<div class="dierr">⚠️ Graph image could not be loaded — check your internet connection.<br>ग्राफ़ इमेज लोड नहीं हो सकी — इंटरनेट चेक करें।</div>'}
const diImg=u=>{const s=diNormUrl(u);if(!s)return '';return `<div class="diw" data-u="${esc(s)}" onclick="openDiZoom(this.dataset.u)" title="Tap to zoom / ज़ूम करने के लिए टैप करें"><img src="${esc(s)}" alt="DI Graph" loading="lazy" onerror="diFallback(this)"><span class="diz"><span class="material-icons" style="font-size:14px">zoom_in</span>Zoom</span></div>`};
const passageHtml=(q,hi)=>{const p=qt(q,'passage',hi),img=diUrl(q);if(!p&&!img)return '';return `<div class="passage">${p?`<div>${mathHtml(p)}</div>`:''}${img?diImg(img):''}</div>`};
function openDiZoom(u){if(!u)return;const old=document.getElementById('diModal');if(old)old.remove();const m=document.createElement('div');m.id='diModal';m.dataset.z='1';
 m.innerHTML=`<div class="ditop"><b>📊 Graph / DI Image <small style="font-weight:400;opacity:.8">(Tap image or button to zoom)</small></b><div class="row" style="margin:0"><button class="s" style="color:#fff;border-color:#fff6;background:#ffffff22;padding:6px 12px" onclick="zoomDiStep()" id="dizb">🔍 1x</button><button class="p" style="padding:6px 12px" onclick="document.getElementById('diModal').remove()">✕ Close</button></div></div><div class="dibody" onclick="if(event.target===this)document.getElementById('diModal').remove()"><img id="dizi" src="${esc(u)}" alt="DI Graph" onerror="diFallback(this)" onclick="zoomDiStep()"></div>`;
 document.body.appendChild(m)}
function zoomDiStep(){const m=document.getElementById('diModal'),im=document.getElementById('dizi'),bt=document.getElementById('dizb');if(!m||!im)return;const cur=+(m.dataset.z||1),nx=cur===1?1.75:cur===1.75?2.5:1;m.dataset.z=String(nx);im.style.width=nx===1?'auto':(nx*100)+'%';im.style.maxWidth=nx===1?'100%':'none';im.style.maxHeight=nx===1?'100%':'none';if(bt)bt.textContent='🔍 '+nx+'x'}
function qHtml(Q,prefix,hi){window.QS=window.QS||{};QS[prefix]=Q;return Q.map((q,i)=>`<div class="q">${passageHtml(q,hi)}<b>${i+1}. ${mathHtml(qt(q,'text',hi))}</b>`+qOpts(q,hi).map((o,j)=>`<label><input type="radio" name="${prefix}${i}" value="${j}">${mathHtml(o)}</label>`).join('')+`<div id="${prefix}x${i}"></div></div>`).join('')}
function grade(Q,prefix,mp,ng,hi){let s=0,c=0,w=0;const ans=[];(window.QS=window.QS||{})[prefix]=Q;(window.BMSRC=window.BMSRC||{})[prefix]=(window.BMSRC||{})[prefix]||(document.querySelector('.pageTitle')||{}).textContent||'Quiz';
 Q.forEach((q,i)=>{const r=document.querySelector(`input[name=${prefix}${i}]:checked`),a=r?+r.value:null;ans.push(a);
  document.querySelectorAll(`input[name=${prefix}${i}]`).forEach(e=>{e.disabled=true;const p=e.parentElement;if(+e.value==q.correctIndex)p.classList.add('ok');else if(+e.value==a)p.classList.add('no')});
  if(a!==null){if(a==q.correctIndex){c++;s+=mp}else{w++;s-=ng}}

 return {s,c,w,ans}}

,"hi":"विवेकी / समझदार","en":"Acting with care and good judgement","example":"It is prudent to save some money."},{"word":"Reluctant","hi":"अनिच्छुक","en":"Unwilling","example":"She was reluctant to speak in public."},{"word":"Spontaneous","hi":"स्वाभाविक / अनायास","en":"Done naturally, without planning","example":"The crowd gave a spontaneous cheer."},{"word":"Trivial","hi":"तुच्छ","en":"Of little importance","example":"Do not waste time on trivial matters."},{"word":"Verbose","hi":"वाचाल / शब्दबहुल","en":"Using more words than needed","example":"His verbose answer confused everyone."},{"word":"Withstand","hi":"सहना / टिके रहना","en":"To resist or endure","example":"The bridge can withstand strong floods."}],"facts":[{"en":"The Ashoka Chakra on the Indian flag has 24 spokes.","hi":"भारतीय तिरंगे के अशोक चक्र में 24 तीलियाँ होती हैं।"},{"en":"The Indian National Flag was adopted by the Constituent Assembly on 22 July 1947.","hi":"राष्ट्रीय ध्वज को संविधान सभा ने 22 जुलाई 1947 को अपनाया।"},{"en":"'Jana Gana Mana' was written by Rabindranath Tagore and adopted as the National Anthem on 24 January 1950.","hi":"'जन गण मन' रवींद्रनाथ टैगोर ने लिखा; 24 जनवरी 1950 को राष्ट्रगान बना।"},{"en":"'Vande Mataram' was written by Bankim Chandra Chattopadhyay (from the novel Anandamath).","hi":"'वंदे मातरम्' बंकिमचंद्र चट्टोपाध्याय ने लिखा (उपन्यास आनंदमठ से)।"},{"en":"India's national animal is the Tiger, national bird the Peacock, national flower the Lotus.","hi":"भारत का राष्ट्रीय पशु बाघ, राष्ट्रीय पक्षी मोर और राष्ट्रीय फूल कमल है।"},{"en":"India's national aquatic animal is the Ganges river dolphin.","hi":"भारत का राष्ट्रीय जलीय जीव गंगा नदी की डॉल्फ़िन है।"},{"en":"The capital of British India moved from Calcutta to Delhi (announced 1911, inaugurated 1931).","hi":"ब्रिटिश भारत की राजधानी कलकत्ता से दिल्ली आई (घोषणा 1911, उद्घाटन 1931)।"},{"en":"Jupiter is the largest planet and Mercury the smallest; Venus is the hottest.","hi":"बृहस्पति सबसे बड़ा ग्रह, बुध सबसे छोटा और शुक्र सबसे गर्म ग्रह है।"},{"en":"Chandrayaan-3 landed near the Moon's south pole on 23 August 2023.","hi":"चंद्रयान-3 23 अगस्त 2023 को चाँद के दक्षिणी ध्रुव के पास उतरा।"},{"en":"ISRO was formed in 1969 (HQ: Bengaluru). India's first satellite Aryabhata was launched in 1975.","hi":"ISRO की स्थापना 1969 में हुई (मुख्यालय: बेंगलुरु)। पहला उपग्रह आर्यभट्ट 1975 में छोड़ा गया।"},{"en":"Bharat Ratna, India's highest civilian award, was instituted in 1954.","hi":"भारत का सर्वोच्च नागरिक सम्मान भारत रत्न 1954 में शुरू हुआ।"},{"en":"Mahatma Gandhi was born on 2 October 1869 in Porbandar, Gujarat.","hi":"महात्मा गांधी का जन्म 2 अक्टूबर 1869 को पोरबंदर (गुजरात) में हुआ।"},{"en":"Indira Gandhi was the first woman Prime Minister of India.","hi":"इंदिरा गांधी भारत की पहली महिला प्रधानमंत्री थीं।"},{"en":"Pratibha Patil became the first woman President of India in 2007.","hi":"प्रतिभा पाटिल 2007 में भारत की पहली महिला राष्ट्रपति बनीं।"},{"en":"Rabindranath Tagore won the Nobel Prize in Literature in 1913, the first Asian to do so.","hi":"रवींद्रनाथ टैगोर ने 1913 में साहित्य का नोबेल जीता, ऐसा करने वाले पहले एशियाई।"},{"en":"C. V. Raman won the Nobel Prize in Physics in 1930 for the Raman Effect.","hi":"सी. वी. रमन ने रमन प्रभाव के लिए 1930 में भौतिकी का नोबेल जीता।"},{"en":"The Taj Mahal in Agra was built by Shah Jahan on the banks of the Yamuna.","hi":"आगरा का ताजमहल शाहजहाँ ने यमुना किनारे बनवाया।"},{"en":"The Konark Sun Temple in Odisha is a UNESCO World Heritage Site.","hi":"ओडिशा का कोणार्क सूर्य मंदिर यूनेस्को विश्व धरोहर स्थल है।"},{"en":"The stapes bone in the ear is the smallest bone; the femur is the largest.","hi":"कान की स्टेपीज़ सबसे छोटी हड्डी और फीमर सबसे बड़ी हड्डी है।"},{"en":"The Pacific is the largest ocean; its Mariana Trench holds the deepest point on Earth.","hi":"प्रशांत सबसे बड़ा महासागर है; मारियाना गर्त पृथ्वी का सबसे गहरा स्थान है।"},{"en":"Mount Everest is 8,849 m high (measured jointly by Nepal and China in 2020).","hi":"माउंट एवरेस्ट की ऊँचाई 8,849 मीटर है (नेपाल-चीन ने 2020 में नापी)।"},{"en":"India became the most populous country in 2023, according to UN estimates.","hi":"UN के अनुमान के अनुसार भारत 2023 में सबसे अधिक आबादी वाला देश बना।"},{"en":"Neeraj Chopra won gold in javelin at the Tokyo Olympics, India’s first Olympic gold in athletics.","hi":"नीरज चोपड़ा ने टोक्यो ओलंपिक में भाला फेंक में स्वर्ण जीता, एथलेटिक्स में भारत का पहला ओलंपिक स्वर्ण।"},{"en":"India won the Cricket World Cup in 1983 (Kapil Dev) and 2011 (M. S. Dhoni).","hi":"भारत ने क्रिकेट विश्व कप 1983 (कपिल देव) और 2011 (एम. एस. धोनी) में जीता।"},{"en":"India has won 8 Olympic gold medals in hockey (1928 to 1980).","hi":"भारत ने हॉकी में 8 ओलंपिक स्वर्ण पदक जीते हैं (1928 से 1980)।"},{"en":"National Sports Day is on 29 August, the birthday of Major Dhyan Chand.","hi":"राष्ट्रीय खेल दिवस 29 अगस्त को मेजर ध्यानचंद के जन्मदिन पर मनाया जाता है।"},{"en":"Teachers' Day is on 5 September; Children's Day on 14 November.","hi":"शिक्षक दिवस 5 सितंबर और बाल दिवस 14 नवंबर को मनाया जाता है।"},{"en":"National Youth Day (12 January) marks the birth of Swami Vivekananda.","hi":"राष्ट्रीय युवा दिवस (12 जनवरी) स्वामी विवेकानंद की जयंती पर मनाया जाता है।"},{"en":"World Environment Day is on 5 June and World Health Day on 7 April.","hi":"विश्व पर्यावरण दिवस 5 जून और विश्व स्वास्थ्य दिवस 7 अप्रैल को होता है।"},{"en":"Aravalli is among the oldest fold mountains in the world; the Himalayas are among the youngest.","hi":"अरावली विश्व की सबसे पुरानी वलित पर्वतमालाओं में है; हिमालय सबसे नई में से एक है।"},{"en":"The Sundarbans is the largest mangrove forest in the world and home to the Bengal tiger.","hi":"सुंदरबन विश्व का सबसे बड़ा मैंग्रोव वन है और बंगाल टाइगर का घर है।"},{"en":"Kaziranga (Assam) is famous for the one-horned rhinoceros; Gir (Gujarat) for the Asiatic lion.","hi":"काजीरंगा (असम) एक सींग वाले गैंडे और गिर (गुजरात) एशियाई शेर के लिए प्रसिद्ध है।"},{"en":"Jim Corbett is India's oldest national park (established 1936).","hi":"जिम कॉर्बेट भारत का सबसे पुराना राष्ट्रीय उद्यान है (1936)।"},{"en":"Charles Babbage is called the Father of the Computer; Tim Berners-Lee invented the World Wide Web.","hi":"चार्ल्स बैबेज को कंप्यूटर का जनक कहते हैं; टिम बर्नर्स-ली ने वर्ल्ड वाइड वेब बनाया।"},{"en":"Digital India was launched on 1 July 2015 and the Jan Dhan Yojana on 28 August 2014.","hi":"डिजिटल इंडिया 1 जुलाई 2015 और जन धन योजना 28 अगस्त 2014 को शुरू हुई।"},{"en":"UPI was launched by NPCI in 2016 and changed how India pays.","hi":"UPI को NPCI ने 2016 में शुरू किया और इसने भारत में भुगतान का तरीका बदल दिया।"},{"en":"G. V. Mavalankar was the first Speaker of the Lok Sabha.","hi":"जी. वी. मावलंकर लोकसभा के पहले अध्यक्ष थे।"},{"en":"Rakesh Sharma became the first Indian to travel to space in 1984.","hi":"राकेश शर्मा 1984 में अंतरिक्ष जाने वाले पहले भारतीय बने।"},{"en":"Viswanathan Anand became India’s first chess Grandmaster in 1988.","hi":"विश्वनाथन आनंद 1988 में भारत के पहले शतरंज ग्रैंडमास्टर बने।"},{"en":"NH 44 (Srinagar to Kanyakumari) is the longest national highway in India.","hi":"NH 44 (श्रीनगर से कन्याकुमारी) भारत का सबसे लंबा राष्ट्रीय राजमार्ग है।"},{"en":"Brahmagupta (628 CE) gave rules for using zero as a number.","hi":"ब्रह्मगुप्त (628 ई.) ने शून्य को एक संख्या की तरह इस्तेमाल करने के नियम दिए।"}],"fcats":{"polity":["Polity","राजव्यवस्था","🏛️"],"geo":["Geography","भूगोल","🌏"],"history":["History","इतिहास","📜"],"science":["Science","विज्ञान","🔬"],"economy":["Economy","अर्थव्यवस्था","💰"],"maths":["Maths Formulas","गणित सूत्र","➗"],"english":["One-Word / English","एक शब्द / अंग्रेज़ी","📖"]},"cards":[{"id":"p01","cat":"polity","q":"Who is called the 'Father of the Indian Constitution'?","qh":"भारतीय संविधान का जनक किसे कहा जाता है?","a":"Dr. B. R. Ambedkar (Chairman of the Drafting Committee).","ah":"डॉ. बी. आर. आंबेडकर (प्रारूप समिति के अध्यक्ष)।"},{"id":"p02","cat":"polity","q":"When did the Constitution of India come into effect?","qh":"भारत का संविधान कब लागू हुआ?","a":"26 January 1950 (it was adopted on 26 November 1949).","ah":"26 जनवरी 1950 (इसे 26 नवंबर 1949 को अपनाया गया था)।"},{"id":"p03","cat":"polity","q":"Article 14 deals with?","qh":"अनुच्छेद 14 किससे संबंधित है?","a":"Equality before law and equal protection of the laws.","ah":"विधि के समक्ष समानता और कानूनों का समान संरक्षण।"},{"id":"p04","cat":"polity","q":"Article 21 guarantees?","qh":"अनुच्छेद 21 क्या गारंटी देता है?","a":"Right to life and personal liberty.","ah":"प्राण और दैहिक स्वतंत्रता का अधिकार।"},{"id":"p05","cat":"polity","q":"Article 21A and which amendment added it?","qh":"अनुच्छेद 21A क्या है और किस संशोधन से जुड़ा?","a":"Right to free and compulsory education for ages 6-14; 86th Amendment (2002).","ah":"6-14 वर्ष के बच्चों को निःशुल्क व अनिवार्य शिक्षा; 86वाँ संशोधन (2002)।"},{"id":"p06","cat":"polity","q":"Which Article is the 'Right to Constitutional Remedies'?","qh":"संवैधानिक उपचारों का अधिकार कौन-सा अनुच्छेद है?","a":"Article 32 (Dr. Ambedkar called it the heart and soul of the Constitution).","ah":"अनुच्छेद 32 (डॉ. आंबेडकर ने इसे संविधान की आत्मा कहा)।"},{"id":"p07","cat":"polity","q":"Fundamental Duties were added by which amendment?","qh":"मौलिक कर्तव्य किस संशोधन से जोड़े गए?","a":"42nd Amendment (1976), Part IVA, Article 51A.","ah":"42वाँ संशोधन (1976), भाग IVA, अनुच्छेद 51A।"},{"id":"p08","cat":"polity","q":"Minimum age: President / Rajya Sabha / Lok Sabha member?","qh":"न्यूनतम आयु: राष्ट्रपति / राज्यसभा / लोकसभा सदस्य?","a":"President 35 years, Rajya Sabha 30 years, Lok Sabha 25 years.","ah":"राष्ट्रपति 35 वर्ष, राज्यसभा 30 वर्ष, लोकसभा 25 वर्ष।"},{"id":"p09","cat":"polity","q":"Name the five writs.","qh":"पाँच रिट (लेख) के नाम बताइए।","a":"Habeas Corpus, Mandamus, Prohibition, Certiorari, Quo Warranto.","ah":"बंदी प्रत्यक्षीकरण, परमादेश, प्रतिषेध, उत्प्रेषण, अधिकार पृच्छा।"},{"id":"p10","cat":"polity","q":"Which amendment gave constitutional status to Panchayati Raj?","qh":"पंचायती राज को संवैधानिक दर्जा किस संशोधन से मिला?","a":"73rd Amendment (1992). Urban local bodies: 74th Amendment.","ah":"73वाँ संशोधन (1992)। नगर निकाय: 74वाँ संशोधन।"},{"id":"p11","cat":"polity","q":"The Anti-Defection Law is in which Schedule?","qh":"दल-बदल विरोधी कानून किस अनुसूची में है?","a":"10th Schedule (added by the 52nd Amendment, 1985).","ah":"10वीं अनुसूची (52वें संशोधन, 1985 से जुड़ी)।"},{"id":"p12","cat":"polity","q":"How many Fundamental Rights are there now? Which right was removed?","qh":"अब कितने मौलिक अधिकार हैं? कौन-सा अधिकार हटा?","a":"Six. Right to Property was removed by the 44th Amendment (1978); it is now a legal right under Article 300A.","ah":"छह। संपत्ति का अधिकार 44वें संशोधन (1978) से हटा; अब अनुच्छेद 300A में कानूनी अधिकार है।"},{"id":"p13","cat":"polity","q":"Which case gave the 'Basic Structure' doctrine?","qh":"'मूल ढाँचा' सिद्धांत किस केस से आया?","a":"Kesavananda Bharati case (1973).","ah":"केशवानंद भारती केस (1973)।"},{"id":"p14","cat":"polity","q":"Article 324 and Article 148 deal with?","qh":"अनुच्छेद 324 और 148 किससे संबंधित हैं?","a":"Article 324: Election Commission. Article 148: Comptroller and Auditor General (CAG).","ah":"अनुच्छेद 324: निर्वाचन आयोग। अनुच्छेद 148: नियंत्रक एवं महालेखा परीक्षक (CAG)।"},{"id":"g01","cat":"geo","q":"Largest and smallest Indian state by area?","qh":"क्षेत्रफल में सबसे बड़ा और सबसे छोटा राज्य?","a":"Largest: Rajasthan. Smallest: Goa.","ah":"सबसे बड़ा: राजस्थान। सबसे छोटा: गोवा।"},{"id":"g02","cat":"geo","q":"Longest river within India?","qh":"भारत के भीतर सबसे लंबी नदी?","a":"Ganga (about 2,525 km).","ah":"गंगा (लगभग 2,525 किमी)।"},{"id":"g03","cat":"geo","q":"Highest peak of India (within Indian territory)?","qh":"भारतीय क्षेत्र की सबसे ऊँची चोटी?","a":"Kangchenjunga (8,586 m), the third highest in the world.","ah":"कंचनजंगा (8,586 मी), विश्व की तीसरी सबसे ऊँची चोटी।"},{"id":"g04","cat":"geo","q":"How many Indian states does the Tropic of Cancer pass through?","qh":"कर्क रेखा भारत के कितने राज्यों से गुज़रती है?","a":"Eight: Gujarat, Rajasthan, Madhya Pradesh, Chhattisgarh, Jharkhand, West Bengal, Tripura, Mizoram.","ah":"आठ: गुजरात, राजस्थान, मध्य प्रदेश, छत्तीसगढ़, झारखंड, पश्चिम बंगाल, त्रिपुरा, मिज़ोरम।"},{"id":"g05","cat":"geo","q":"Standard Meridian of India?","qh":"भारत की मानक याम्योत्तर रेखा?","a":"82°30′ E, passing near Mirzapur (Uttar Pradesh). IST = UTC + 5:30.","ah":"82°30′ पूर्व, मिर्ज़ापुर (उत्तर प्रदेश) के पास से। IST = UTC + 5:30।"},{"id":"g06","cat":"geo","q":"Largest brackish-water lagoon in India?","qh":"भारत की सबसे बड़ी खारे पानी की लैगून झील?","a":"Chilika Lake (Odisha).","ah":"चिल्का झील (ओडिशा)।"},{"id":"g07","cat":"geo","q":"Which two big rivers flow west into the Arabian Sea through rift valleys?","qh":"कौन-सी दो बड़ी नदियाँ दरार घाटियों से पश्चिम में अरब सागर में गिरती हैं?","a":"Narmada and Tapi.","ah":"नर्मदा और तापी।"},{"id":"g08","cat":"geo","q":"'Dakshin Ganga' is the name of which river?","qh":"'दक्षिण गंगा' किस नदी को कहते हैं?","a":"Godavari.","ah":"गोदावरी।"},{"id":"g09","cat":"geo","q":"Highest peak of the Western Ghats?","qh":"पश्चिमी घाट की सबसे ऊँची चोटी?","a":"Anamudi (2,695 m), Kerala.","ah":"अनामुडी (2,695 मी), केरल।"},{"id":"g10","cat":"geo","q":"Which soil is best for cotton? Another name?","qh":"कपास के लिए सबसे अच्छी मिट्टी? दूसरा नाम?","a":"Black soil, also called Regur.","ah":"काली मिट्टी, जिसे रेगुर भी कहते हैं।"},{"id":"g11","cat":"geo","q":"Wettest place in India (Meghalaya)?","qh":"भारत का सबसे अधिक वर्षा वाला स्थान (मेघालय)?","a":"Mawsynram (Cherrapunji is nearby).","ah":"मौसिनराम (चेरापूंजी पास में है)।"},{"id":"g12","cat":"geo","q":"How many land neighbours does India have?","qh":"भारत के कितने स्थलीय पड़ोसी देश हैं?","a":"Seven: Pakistan, Afghanistan, China, Nepal, Bhutan, Bangladesh, Myanmar.","ah":"सात: पाकिस्तान, अफ़गानिस्तान, चीन, नेपाल, भूटान, बांग्लादेश, म्यांमार।"},{"id":"g13","cat":"geo","q":"Southernmost point of India?","qh":"भारत का सबसे दक्षिणी बिंदु?","a":"Indira Point (Great Nicobar Island).","ah":"इंदिरा पॉइंट (ग्रेट निकोबार द्वीप)।"},{"id":"g14","cat":"geo","q":"Oldest fold mountain range of India vs the youngest?","qh":"भारत की सबसे पुरानी और सबसे नई वलित पर्वतमाला?","a":"Oldest: Aravalli. Youngest: Himalaya.","ah":"सबसे पुरानी: अरावली। सबसे नई: हिमालय।"},{"id":"h01","cat":"history","q":"Battle of Plassey and Battle of Buxar - years?","qh":"प्लासी और बक्सर के युद्ध - वर्ष?","a":"Plassey: 1757. Buxar: 1764.","ah":"प्लासी: 1757। बक्सर: 1764।"},{"id":"h02","cat":"history","q":"Where and when did the Revolt of 1857 begin?","qh":"1857 की क्रांति कहाँ और कब शुरू हुई?","a":"Meerut, 10 May 1857.","ah":"मेरठ, 10 मई 1857।"},{"id":"h03","cat":"history","q":"Jallianwala Bagh massacre - date, place, officer?","qh":"जलियाँवाला बाग हत्याकांड - तारीख, स्थान, अधिकारी?","a":"13 April 1919, Amritsar; General Dyer.","ah":"13 अप्रैल 1919, अमृतसर; जनरल डायर।"},{"id":"h04","cat":"history","q":"Why was the Non-Cooperation Movement withdrawn?","qh":"असहयोग आंदोलन क्यों वापस लिया गया?","a":"After the Chauri Chaura incident (1922).","ah":"चौरी-चौरा कांड (1922) के बाद।"},{"id":"h05","cat":"history","q":"Dandi March - date and purpose?","qh":"दांडी मार्च - तारीख और उद्देश्य?","a":"12 March 1930; Salt Satyagraha against the salt law (Civil Disobedience Movement).","ah":"12 मार्च 1930; नमक कानून के विरोध में नमक सत्याग्रह (सविनय अवज्ञा आंदोलन)।"},{"id":"h06","cat":"history","q":"Quit India Movement - date and slogan?","qh":"भारत छोड़ो आंदोलन - तारीख और नारा?","a":"8 August 1942; 'Do or Die'.","ah":"8 अगस्त 1942; 'करो या मरो'।"},{"id":"h07","cat":"history","q":"Who founded the Indian National Congress and when? First president?","qh":"भारतीय राष्ट्रीय कांग्रेस की स्थापना किसने और कब की? पहले अध्यक्ष?","a":"A. O. Hume, 1885. First president: W. C. Bonnerjee.","ah":"ए. ओ. ह्यूम, 1885। पहले अध्यक्ष: डब्ल्यू. सी. बनर्जी।"},{"id":"h08","cat":"history","q":"Who partitioned Bengal and when?","qh":"बंगाल का विभाजन किसने और कब किया?","a":"Lord Curzon, 1905.","ah":"लॉर्ड कर्ज़न, 1905।"},{"id":"h09","cat":"history","q":"First Battle of Panipat - year and winner?","qh":"पानीपत का पहला युद्ध - वर्ष और विजेता?","a":"1526; Babur defeated Ibrahim Lodi.","ah":"1526; बाबर ने इब्राहीम लोदी को हराया।"},{"id":"h10","cat":"history","q":"Battle of Haldighati - year and fighters?","qh":"हल्दीघाटी का युद्ध - वर्ष और योद्धा?","a":"1576; Akbar's army (Man Singh) vs Maharana Pratap.","ah":"1576; अकबर की सेना (मान सिंह) बनाम महाराणा प्रताप।"},{"id":"h11","cat":"history","q":"Which war made Ashoka turn to Buddhism?","qh":"किस युद्ध के बाद अशोक ने बौद्ध धर्म अपनाया?","a":"The Kalinga War (about 261 BCE).","ah":"कलिंग युद्ध (लगभग 261 ईसा पूर्व)।"},{"id":"h12","cat":"history","q":"Which period is called the 'Golden Age' of ancient India?","qh":"प्राचीन भारत का 'स्वर्ण युग' किस काल को कहते हैं?","a":"The Gupta period.","ah":"गुप्त काल।"},{"id":"h13","cat":"history","q":"Famous structure of Mohenjo-daro?","qh":"मोहनजोदड़ो की प्रसिद्ध संरचना?","a":"The Great Bath.","ah":"विशाल स्नानागार (ग्रेट बाथ)।"},{"id":"h14","cat":"history","q":"First President of India and first PM of India?","qh":"भारत के पहले राष्ट्रपति और पहले प्रधानमंत्री?","a":"President: Dr. Rajendra Prasad. PM: Jawaharlal Nehru.","ah":"राष्ट्रपति: डॉ. राजेंद्र प्रसाद। प्रधानमंत्री: जवाहरलाल नेहरू।"},{"id":"s01","cat":"science","q":"SI units of force, energy, power, pressure?","qh":"बल, ऊर्जा, शक्ति, दाब की SI इकाइयाँ?","a":"Force: Newton. Energy/Work: Joule. Power: Watt. Pressure: Pascal.","ah":"बल: न्यूटन। ऊर्जा/कार्य: जूल। शक्ति: वाट। दाब: पास्कल।"},{"id":"s02","cat":"science","q":"Speed of light in vacuum?","qh":"निर्वात में प्रकाश की चाल?","a":"About 3 × 10⁸ m/s (3,00,000 km/s).","ah":"लगभग 3 × 10⁸ मी/से (3,00,000 किमी/से)।"},{"id":"s03","cat":"science","q":"Diseases from deficiency of Vitamin A, B1, C, D?","qh":"विटामिन A, B1, C, D की कमी से रोग?","a":"A: Night blindness. B1: Beriberi. C: Scurvy. D: Rickets.","ah":"A: रतौंधी। B1: बेरीबेरी। C: स्कर्वी। D: रिकेट्स।"},{"id":"s04","cat":"science","q":"Powerhouse of the cell?","qh":"कोशिका का ऊर्जा-घर?","a":"Mitochondria.","ah":"माइटोकॉन्ड्रिया।"},{"id":"s05","cat":"science","q":"Number of bones in an adult human body? Largest and smallest bone?","qh":"वयस्क शरीर में हड्डियाँ? सबसे बड़ी और सबसे छोटी हड्डी?","a":"206. Largest: femur (thigh). Smallest: stapes (ear).","ah":"206। सबसे बड़ी: फीमर (जाँघ)। सबसे छोटी: स्टेपीज़ (कान)।"},{"id":"s06","cat":"science","q":"Largest organ and largest gland of the human body?","qh":"मानव शरीर का सबसे बड़ा अंग और सबसे बड़ी ग्रंथि?","a":"Largest organ: skin. Largest gland: liver.","ah":"सबसे बड़ा अंग: त्वचा। सबसे बड़ी ग्रंथि: यकृत (लिवर)।"},{"id":"s07","cat":"science","q":"pH of pure water? Acid and base range?","qh":"शुद्ध जल का pH? अम्ल और क्षार की सीमा?","a":"7 (neutral). Below 7 acidic, above 7 basic.","ah":"7 (उदासीन)। 7 से कम अम्लीय, 7 से अधिक क्षारीय।"},{"id":"s08","cat":"science","q":"Chemical formulas: common salt, baking soda, bleaching powder?","qh":"रासायनिक सूत्र: नमक, खाने का सोडा, ब्लीचिंग पाउडर?","a":"NaCl, NaHCO₃, CaOCl₂.","ah":"NaCl, NaHCO₃, CaOCl₂।"},{"id":"s09","cat":"science","q":"Chemical name of Plaster of Paris?","qh":"प्लास्टर ऑफ पेरिस का रासायनिक नाम?","a":"Calcium sulphate hemihydrate (CaSO₄·½H₂O).","ah":"कैल्शियम सल्फेट हेमिहाइड्रेट (CaSO₄·½H₂O)।"},{"id":"s10","cat":"science","q":"Ohm's law?","qh":"ओम का नियम?","a":"V = I × R (voltage = current × resistance).","ah":"V = I × R (वोल्टेज = धारा × प्रतिरोध)।"},{"id":"s11","cat":"science","q":"Most abundant gas in the atmosphere? Lightest gas?","qh":"वायुमंडल में सबसे अधिक गैस? सबसे हल्की गैस?","a":"Most abundant: Nitrogen (about 78%). Lightest: Hydrogen.","ah":"सबसे अधिक: नाइट्रोजन (लगभग 78%)। सबसे हल्की: हाइड्रोजन।"},{"id":"s12","cat":"science","q":"Deficiency diseases: iron, iodine, calcium?","qh":"कमी से रोग: आयरन, आयोडीन, कैल्शियम?","a":"Iron: Anaemia. Iodine: Goitre. Calcium: weak bones / Osteoporosis.","ah":"आयरन: एनीमिया। आयोडीन: घेंघा। कैल्शियम: कमज़ोर हड्डियाँ / ऑस्टियोपोरोसिस।"},{"id":"s13","cat":"science","q":"Hardest natural substance?","qh":"सबसे कठोर प्राकृतिक पदार्थ?","a":"Diamond.","ah":"हीरा।"},{"id":"s14","cat":"science","q":"Normal human body temperature?","qh":"मानव शरीर का सामान्य तापमान?","a":"37 °C (98.6 °F).","ah":"37 °C (98.6 °F)।"},{"id":"e01","cat":"economy","q":"When was RBI established? Where is its headquarters?","qh":"RBI की स्थापना कब हुई? मुख्यालय कहाँ है?","a":"1 April 1935; headquarters in Mumbai (nationalised in 1949).","ah":"1 अप्रैल 1935; मुख्यालय मुंबई (1949 में राष्ट्रीयकृत)।"},{"id":"e02","cat":"economy","q":"What is the Repo Rate?","qh":"रेपो रेट क्या है?","a":"The rate at which RBI lends short-term money to commercial banks.","ah":"वह दर जिस पर RBI वाणिज्यिक बैंकों को अल्पकालिक ऋण देता है।"},{"id":"e03","cat":"economy","q":"When was GST implemented in India?","qh":"भारत में GST कब लागू हुआ?","a":"1 July 2017.","ah":"1 जुलाई 2017।"},{"id":"e04","cat":"economy","q":"NITI Aayog replaced which body and when?","qh":"नीति आयोग ने किसकी जगह ली और कब?","a":"Planning Commission; 1 January 2015.","ah":"योजना आयोग; 1 जनवरी 2015।"},{"id":"e05","cat":"economy","q":"Financial year in India?","qh":"भारत में वित्तीय वर्ष?","a":"1 April to 31 March.","ah":"1 अप्रैल से 31 मार्च।"},{"id":"e06","cat":"economy","q":"First Five Year Plan - period?","qh":"पहली पंचवर्षीय योजना - अवधि?","a":"1951-56.","ah":"1951-56।"},{"id":"e07","cat":"economy","q":"Who is the 'Father of the White Revolution' (Operation Flood)?","qh":"श्वेत क्रांति (ऑपरेशन फ्लड) के जनक?","a":"Dr. Verghese Kurien.","ah":"डॉ. वर्गीज़ कुरियन।"},{"id":"e08","cat":"economy","q":"Which Article deals with the Annual Financial Statement (Budget)?","qh":"वार्षिक वित्तीय विवरण (बजट) किस अनुच्छेद में है?","a":"Article 112.","ah":"अनुच्छेद 112।"},{"id":"m01","cat":"maths","q":"Area and circumference of a circle?","qh":"वृत्त का क्षेत्रफल और परिधि?","a":"Area = πr². Circumference = 2πr.","ah":"क्षेत्रफल = πr²। परिधि = 2πr।"},{"id":"m02","cat":"maths","q":"Area of a triangle (two formulas)?","qh":"त्रिभुज का क्षेत्रफल (दो सूत्र)?","a":"½ × base × height. Heron: √[s(s−a)(s−b)(s−c)], s = (a+b+c)/2.","ah":"½ × आधार × ऊँचाई। हेरोन: √[s(s−a)(s−b)(s−c)], s = (a+b+c)/2।"},{"id":"m03","cat":"maths","q":"Volume and curved surface area of a cylinder?","qh":"बेलन का आयतन और वक्र पृष्ठ क्षेत्रफल?","a":"Volume = πr²h. CSA = 2πrh.","ah":"आयतन = πr²h। वक्र पृष्ठ = 2πrh।"},{"id":"m04","cat":"maths","q":"Volume and surface area of a sphere?","qh":"गोले का आयतन और पृष्ठ क्षेत्रफल?","a":"Volume = 4/3 πr³. Surface area = 4πr².","ah":"आयतन = 4/3 πr³। पृष्ठ क्षेत्रफल = 4πr²।"},{"id":"m05","cat":"maths","q":"Volume of a cone?","qh":"शंकु का आयतन?","a":"1/3 × πr²h.","ah":"1/3 × πr²h।"},{"id":"m06","cat":"maths","q":"(a + b)² and a² − b²?","qh":"(a + b)² और a² − b²?","a":"(a+b)² = a² + 2ab + b². a² − b² = (a+b)(a−b).","ah":"(a+b)² = a² + 2ab + b²। a² − b² = (a+b)(a−b)।"},{"id":"m07","cat":"maths","q":"Simple Interest and Compound Amount?","qh":"साधारण ब्याज और चक्रवृद्धि मिश्रधन?","a":"SI = (P × R × T)/100. Amount = P(1 + R/100)ⁿ.","ah":"SI = (P × R × T)/100। मिश्रधन = P(1 + R/100)ⁿ।"},{"id":"m08","cat":"maths","q":"Convert km/h to m/s? Average speed for equal distances at speeds x and y?","qh":"किमी/घंटा से मी/से? बराबर दूरी पर चाल x और y हो तो औसत चाल?","a":"Multiply by 5/18. Average speed = 2xy/(x+y).","ah":"5/18 से गुणा करें। औसत चाल = 2xy/(x+y)।"},{"id":"m09","cat":"maths","q":"Profit % and selling price formula?","qh":"लाभ % और विक्रय मूल्य का सूत्र?","a":"Profit % = (Profit/CP) × 100. SP = CP × (100 + P%)/100.","ah":"लाभ % = (लाभ/क्रय मूल्य) × 100। SP = CP × (100 + P%)/100।"},{"id":"m10","cat":"maths","q":"Sum of first n natural numbers and of their squares?","qh":"पहली n प्राकृत संख्याओं का योग और उनके वर्गों का योग?","a":"n(n+1)/2 and n(n+1)(2n+1)/6.","ah":"n(n+1)/2 और n(n+1)(2n+1)/6।"},{"id":"m11","cat":"maths","q":"Roots of ax² + bx + c = 0?","qh":"ax² + bx + c = 0 के मूल?","a":"x = [−b ± √(b² − 4ac)] / 2a.","ah":"x = [−b ± √(b² − 4ac)] / 2a।"},{"id":"m12","cat":"maths","q":"nth term and sum of an AP?","qh":"AP का nवाँ पद और योग?","a":"aₙ = a + (n−1)d. Sₙ = n/2 × [2a + (n−1)d].","ah":"aₙ = a + (n−1)d। Sₙ = n/2 × [2a + (n−1)d]।"},{"id":"n01","cat":"english","q":"One word: 'One who knows everything'","qh":"एक शब्द: 'जो सब कुछ जानता हो'","a":"Omniscient.","ah":"सर्वज्ञ (Omniscient)।"},{"id":"n02","cat":"english","q":"One word: 'Study of birds'","qh":"एक शब्द: 'पक्षियों का अध्ययन'","a":"Ornithology.","ah":"पक्षी विज्ञान (Ornithology)।"},{"id":"n03","cat":"english","q":"One word: 'Fear of heights'","qh":"एक शब्द: 'ऊँचाई से डर'","a":"Acrophobia.","ah":"एक्रोफोबिया (Acrophobia)।"},{"id":"n04","cat":"english","q":"One word: 'A person who loves books'","qh":"एक शब्द: 'किताबों से प्यार करने वाला'","a":"Bibliophile.","ah":"पुस्तक-प्रेमी (Bibliophile)।"},{"id":"n05","cat":"english","q":"One word: 'A medicine that cures all diseases'","qh":"एक शब्द: 'सब रोगों की दवा'","a":"Panacea.","ah":"रामबाण (Panacea)।"},{"id":"n06","cat":"english","q":"One word: 'Speaking in one's sleep'","qh":"एक शब्द: 'नींद में बोलना'","a":"Somniloquy.","ah":"नींद में बड़बड़ाना (Somniloquy)।"},{"id":"n07","cat":"english","q":"One word: 'Killing of one's own brother'","qh":"एक शब्द: 'अपने भाई की हत्या'","a":"Fratricide.","ah":"भ्रातृहत्या (Fratricide)।"},{"id":"n08","cat":"english","q":"One word: 'A government by the rich'","qh":"एक शब्द: 'अमीरों का शासन'","a":"Plutocracy.","ah":"धनिकतंत्र (Plutocracy)।"}],"syl":[{"id":"ssc","emoji":"🧾","en":"SSC CGL / CHSL","hi":"एसएससी सीजीएल / सीएचएसएल","subjects":[{"id":"quant","emoji":"🔢","en":"Quantitative Aptitude","hi":"गणित","topics":[{"id":"q.numsys","en":"Number System","hi":"संख्या पद्धति"},{"id":"q.hcflcm","en":"HCF & LCM","hi":"म.स. और ल.स."},{"id":"q.simp","en":"Simplification & BODMAS","hi":"सरलीकरण"},{"id":"q.sqrt","en":"Squares, Roots & Approximation","hi":"वर्ग, मूल और सन्निकटन"},{"id":"q.percent","en":"Percentage","hi":"प्रतिशत"},{"id":"q.ratio","en":"Ratio & Proportion","hi":"अनुपात और समानुपात"},{"id":"q.avg","en":"Average","hi":"औसत"},{"id":"q.pl","en":"Profit, Loss & Discount","hi":"लाभ, हानि और छूट"},{"id":"q.si","en":"Simple & const GYF=[{"topic": "Science", "en": "The SI unit of luminous intensity is the candela, luminous flux is measured in lumen, and illuminance in lux.", "hi": "ज्योति-तीव्रता का SI मात्रक कैंडेला, ज्योति-फ्लक्स का ल्यूमेन और प्रदीप्ति का लक्स है।"}, {"topic": "Science", "en": "The Chandrasekhar limit, about 1.4 times the mass of the Sun, is the maximum mass of a stable white dwarf star.", "hi": "चंद्रशेखर सीमा (सूर्य के द्रव्यमान का लगभग 1.4 गुना) एक स्थिर श्वेत वामन तारे का अधिकतम द्रव्यमान है।"}, {"topic": "Science", "en": "C. V. Raman discovered the Raman Effect, the scattering of light with a change in wavelength, on 28 February 1928; the day is celebrated as National Science Day.", "hi": "सी. वी. रमन ने 28 फरवरी 1928 को रमन प्रभाव खोजा (प्रकाश के प्रकीर्णन में तरंगदैर्ध्य बदलना); यह दिन राष्ट्रीय विज्ञान दिवस है।"}, {"topic": "Science", "en": "Bose–Einstein condensate is called the fifth state of matter, and the particle class ‘boson’ is named after the Indian physicist S. N. Bose.", "hi": "बोस–आइंस्टीन संघनित को पदार्थ की पाँचवीं अवस्था कहते हैं, और ‘बोसॉन’ कण का नाम भारतीय भौतिकशास्त्री एस. एन. बोस पर रखा गया है।"}, {"topic": "Science", "en": "Food cooks faster in a pressure cooker because higher pressure raises the boiling point of water above 100 °C.", "hi": "प्रेशर कुकर में खाना जल्दी पकता है क्योंकि अधिक दाब पर पानी का क्वथनांक 100 °C से ऊपर चला जाता है।"}, {"topic": "Science", "en": "The sky looks blue because of Rayleigh scattering, which is proportional to 1/λ⁴; red light scatters the least, so it is used for danger signals.", "hi": "आकाश नीला रेले प्रकीर्णन (1/λ⁴ के समानुपाती) के कारण दिखता है; लाल प्रकाश सबसे कम बिखरता है, इसलिए खतरे के संकेत में उपयोग होता है।"}, {"topic": "Science", "en": "Optical fibres work on total internal reflection, which happens only when light travels from a denser to a rarer medium at an angle greater than the critical angle.", "hi": "ऑप्टिकल फाइबर पूर्ण आंतरिक परावर्तन पर काम करते हैं; यह तभी होता है जब प्रकाश सघन से विरल माध्यम में क्रांतिक कोण से बड़े कोण पर जाए।"}, {"topic": "Science", "en": "Sound travels fastest in solids, slower in liquids and slowest in gases, and it cannot travel through a vacuum.", "hi": "ध्वनि ठोस में सबसे तेज़, द्रव में उससे धीमी और गैस में सबसे धीमी चलती है, और निर्वात में नहीं चल सकती।"}, {"topic": "Science", "en": "Mercury and bromine are the only two elements that are liquid at room temperature.", "hi": "पारा और ब्रोमीन ही ऐसे दो तत्व हैं जो कमरे के तापमान पर द्रव अवस्था में होते हैं।"}, {"topic": "Science", "en": "Aqua regia, a 3:1 mixture of concentrated hydrochloric acid and nitric acid, can dissolve gold and platinum.", "hi": "ऐक्वा रेजिया (सांद्र हाइड्रोक्लोरिक और नाइट्रिक अम्ल का 3:1 मिश्रण) सोना और प्लैटिनम को घोल सकता है।"}, {"topic": "Science", "en": "Dry ice is solid carbon dioxide; it sublimes at −78.5 °C instead of melting.", "hi": "शुष्क बर्फ ठोस कार्बन डाइऑक्साइड है; यह पिघलने के बजाय −78.5 °C पर सीधे गैस बन जाती (ऊर्ध्वपातित होती) है।"}, {"topic": "Science", "en": "In the Haber process ammonia is made from nitrogen and hydrogen using an iron catalyst; in the Contact process sulphuric acid is made using vanadium pentoxide.", "hi": "हैबर विधि में लोहे के उत्प्रेरक से नाइट्रोजन और हाइड्रोजन द्वारा अमोनिया बनती है; संपर्क विधि में वैनेडियम पेंटाऑक्साइड से सल्फ्यूरिक अम्ल बनता है।"}, {"topic": "Science", "en": "Bleaching powder is calcium oxychloride (CaOCl₂), and plaster of Paris is calcium sulphate hemihydrate (CaSO₄·½H₂O).", "hi": "विरंजक चूर्ण कैल्सियम ऑक्सीक्लोराइड (CaOCl₂) और प्लास्टर ऑफ पेरिस कैल्सियम सल्फेट अर्धहाइड्रेट (CaSO₄·½H₂O) है।"}, {"topic": "Science", "en": "Bakelite was the first fully synthetic plastic, and it is a thermosetting plastic that cannot be softened again by heating.", "hi": "बेकेलाइट पहला पूर्णतः संश्लेषित प्लास्टिक था; यह तापदृढ़ (थर्मोसेटिंग) प्लास्टिक है जो गर्म करने पर दोबारा नरम नहीं होता।"}, {"topic": "Science", "en": "The pH of human blood is about 7.4, while gastric juice, which contains hydrochloric acid, has a pH of about 1.5 to 3.5.", "hi": "मानव रक्त का pH लगभग 7.4 होता है, जबकि हाइड्रोक्लोरिक अम्ल वाले आमाशय रस का pH लगभग 1.5 से 3.5 होता है।"}, {"topic": "Science", "en": "Insulin is secreted by the beta cells of the islets of Langerhans in the pancreas, and its deficiency causes diabetes mellitus.", "hi": "इंसुलिन अग्न्याशय के लैंगरहैंस द्वीप की बीटा कोशिकाओं से स्रावित होती है; इसकी कमी से मधुमेह होता है।"}, {"topic": "Science", "en": "Haemoglobin contains iron, chlorophyll contains magnesium, and vitamin B12 (cobalamin) contains cobalt.", "hi": "हीमोग्लोबिन में लोहा, क्लोरोफिल में मैग्नीशियम और विटामिन B12 (कोबालामिन) में कोबाल्ट होता है।"}, {"topic": "Science", "en": "Scurvy is caused by vitamin C deficiency, rickets by vitamin D, beriberi by vitamin B1 and pellagra by vitamin B3.", "hi": "विटामिन C की कमी से स्कर्वी, D की कमी से रिकेट्स, B1 की कमी से बेरीबेरी और B3 की कमी से पेलाग्रा होता है।"}, {"topic": "Science", "en": "The sinoatrial (SA) node, called the natural pacemaker of the heart, initiates each heartbeat.", "hi": "साइनोएट्रियल (SA) नोड को हृदय का प्राकृतिक पेसमेकर कहते हैं; यह हर धड़कन शुरू करता है।"}, {"topic": "Science", "en": "Gregor Mendel, the Father of Genetics, worked on pea plants, and his laws of inheritance were rediscovered in 1900.", "hi": "आनुवंशिकी के जनक ग्रेगर मेंडल ने मटर के पौधों पर काम किया; उनके नियम 1900 में पुनः खोजे गए।"}, {"topic": "Science", "en": "In photosynthesis the light reaction occurs in the thylakoids, and the dark reaction (Calvin cycle) in the stroma of the chloroplast.", "hi": "प्रकाश संश्लेषण में प्रकाश अभिक्रिया थायलाकॉइड में और अप्रकाश अभिक्रिया (कैल्विन चक्र) हरितलवक के स्ट्रोमा में होती है।"}, {"topic": "Science", "en": "Glycolysis takes place in the cytoplasm, while the Krebs cycle takes place in the matrix of the mitochondria.", "hi": "ग्लाइकोलिसिस कोशिका द्रव्य में और क्रेब्स चक्र माइटोकॉन्ड्रिया के मैट्रिक्स में होता है।"}, {"topic": "Science", "en": "Malaria is caused by the protozoan Plasmodium and spread by the female Anopheles mosquito, while dengue is spread by the Aedes mosquito.", "hi": "मलेरिया प्रोटोज़ोआ प्लाज़्मोडियम से होता है और मादा एनोफिलीज़ मच्छर फैलाती है; डेंगू एडीज़ मच्छर फैलाता है।"}, {"topic": "Science", "en": "The oral polio vaccine was developed by Albert Sabin, and the injectable polio vaccine by Jonas Salk.", "hi": "मुँह से दी जाने वाली पोलियो वैक्सीन अल्बर्ट सेबिन ने और इंजेक्शन वाली जोनास साल्क ने बनाई।"}, {"topic": "Science", "en": "Red blood cells of mammals have no nucleus, are made in the bone marrow, and live for about 120 days.", "hi": "स्तनधारियों की लाल रक्त कोशिकाओं में केंद्रक नहीं होता, ये अस्थि मज्जा में बनती हैं और लगभग 120 दिन जीवित रहती हैं।"}, {"topic": "Science", "en": "ISRO’s Mars Orbiter Mission was launched on 5 November 2013 and entered Mars orbit on 24 September 2014, making India the first country to succeed on its first attempt.", "hi": "इसरो का मंगलयान 5 नवंबर 2013 को छोड़ा गया और 24 सितंबर 2014 को मंगल की कक्षा में पहुँचा; पहले ही प्रयास में सफल होने वाला भारत पहला देश बना।"}, {"topic": "Science", "en": "Aditya-L1, India’s first solar observatory mission, was launched on 2 September 2023 and placed in a halo orbit around the Sun–Earth Lagrange point L1.", "hi": "आदित्य-L1, भारत का पहला सौर वेधशाला मिशन, 2 सितंबर 2023 को छोड़ा गया और सूर्य-पृथ्वी के लैग्रेंज बिंदु L1 के चारों ओर हेलो कक्षा में स्थापित हुआ।"}, {"topic": "Science", "en": "Thumba in Kerala, from where India’s first sounding rocket was launched in 1963, and Sriharikota in Andhra Pradesh, home of the Satish Dhawan Space Centre, are the main rocket launch sites of India.", "hi": "केरल का थुंबा (जहाँ से 1963 में पहला भारतीय साउंडिंग रॉकेट छोड़ा गया) और आंध्र प्रदेश का श्रीहरिकोटा (सतीश धवन अंतरिक्ष केंद्र) भारत के मुख्य रॉकेट प्रक्षेपण स्थल हैं।"}, {"topic": "Polity", "en": "In Kesavananda Bharati v. State of Kerala (1973), a 13-judge bench ruled by 7:6 that Parliament can amend the Constitution under Article 368 but cannot alter its ‘basic structure’.", "hi": "केशवानंद भारती बनाम केरल राज्य (1973) में 13 न्यायाधीशों की पीठ ने 7:6 से कहा कि संसद अनुच्छेद 368 के तहत संविधान संशोधित कर सकती है पर इसकी ‘मूल संरचना’ नहीं बदल सकती।"}, {"topic": "Polity", "en": "The 42nd Amendment (1976) added the words ‘Socialist’, ‘Secular’ and ‘Integrity’ to the Preamble and inserted Fundamental Duties as Part IV-A (Article 51A).", "hi": "42वें संशोधन (1976) ने प्रस्तावना में ‘समाजवादी’, ‘पंथनिरपेक्ष’ और ‘अखंडता’ शब्द जोड़े और मूल कर्तव्य (भाग IV-A, अनुच्छेद 51A) जोड़े।"}, {"topic": "Polity", "en": "Fundamental Duties were added on the recommendation of the Swaran Singh Committee, and the 86th Amendment (2002) added the 11th duty: to provide education to a child aged 6 to 14 years.", "hi": "मूल कर्तव्य स्वर्ण सिंह समिति की सिफारिश पर जोड़े गए; 86वें संशोधन (2002) ने 11वाँ कर्तव्य (6 से 14 वर्ष के बच्चे को शिक्षा दिलाना) जोड़ा।"}, {"topic": "Polity", "en": "Dr B. R. Ambedkar called Article 32, the right to move the Supreme Court for Fundamental Rights, the ‘heart and soul’ of the Constitution.", "hi": "डॉ. बी. आर. अंबेडकर ने मौलिक अधिकारों के लिए सर्वोच्च न्यायालय जाने के अधिकार, अनुच्छेद 32, को संविधान की ‘आत्मा और हृदय’ कहा।"}, {"topic": "Polity", "en": "Article 226 lets High Courts issue writs for Fundamental Rights ‘and for any other purpose’, so its scope is wider than that of Article 32.", "hi": "अनुच्छेद 226 उच्च न्यायालयों को मौलिक अधिकारों ‘और किसी अन्य उद्देश्य’ के लिए रिट जारी करने देता है, इसलिए इसका दायरा अनुच्छेद 32 से व्यापक है।"}, {"topic": "Polity", "en": "The five writs are Habeas Corpus, Mandamus, Prohibition, Certiorari and Quo Warranto.", "hi": "पाँच रिट हैं: बंदी प्रत्यक्षीकरण, परमादेश, प्रतिषेध, उत्प्रेषण और अधिकार-पृच्छा।"}, {"topic": "Polity", "en": "The 44th Amendment (1978) removed the Right to Property from the Fundamental Rights and made it a legal right under Article 300A.", "hi": "44वें संशोधन (1978) ने संपत्ति के अधिकार को मौलिक अधिकारों से हटाकर अनुच्छेद 300A के तहत कानूनी अधिकार बना दिया।"}, {"topic": "Polity", "en": "The Anti-Defection Law is the Tenth Schedule, added by the 52nd Amendment (1985); the 91st Amendment (2003) capped the Council of Ministers at 15 percent of the House.", "hi": "दल-बदल विरोधी कानून दसवीं अनुसूची है (52वाँ संशोधन, 1985); 91वें संशोधन (2003) ने मंत्रिपरिषद को सदन की सदस्य संख्या के 15 प्रतिशत तक सीमित किया।"}, {"topic": "Polity", "en": "The 73rd Amendment (1992) gave constitutional status to Panchayati Raj (Part IX, Eleventh Schedule) and the 74th Amendment to urban local bodies (Part IX-A, Twelfth Schedule).", "hi": "73वें संशोधन (1992) ने पंचायती राज (भाग IX, ग्यारहवीं अनुसूची) और 74वें संशोधन ने नगरीय निकायों (भाग IX-A, बारहवीं अनुसूची) को संवैधानिक दर्जा दिया।"}, {"topic": "Polity", "en": "Panchayati Raj was first launched at Nagaur in Rajasthan on 2 October 1959, following the Balwant Rai Mehta Committee report.", "hi": "बलवंत राय मेहता समिति की रिपोर्ट के बाद पंचायती राज सबसे पहले 2 अक्टूबर 1959 को राजस्थान के नागौर में शुरू हुआ।"}, {"topic": "Polity", "en": "The 101st Amendment (2016) introduced GST, and the GST Council is constituted under Article 279A.", "hi": "101वें संशोधन (2016) ने GST लागू किया; GST परिषद अनुच्छेद 279A के तहत गठित होती है।"}, {"topic": "Polity", "en": "A Money Bill (Article 110) can be introduced only in the Lok Sabha, and the Rajya Sabha can only recommend changes within 14 days.", "hi": "धन विधेयक (अनुच्छेद 110) केवल लोकसभा में पेश हो सकता है और राज्यसभा 14 दिन के भीतर केवल सिफारिशें दे सकती है।"}, {"topic": "Polity", "en": "Joint sittings of Parliament under Article 108 have been held three times: 1961 (Dowry Prohibition Bill), 1978 (Banking Service Commission Repeal Bill) and 2002 (POTA).", "hi": "अनुच्छेद 108 के तहत संसद की संयुक्त बैठक तीन बार हुई: 1961 (दहेज निषेध विधेयक), 1978 (बैंकिंग सेवा आयोग निरसन विधेयक) और 2002 (पोटा)।"}, {"topic": "Polity", "en": "The Comptroller and Auditor General (Article 148) is appointed by the President and can be removed only in the same manner as a Supreme Court judge.", "hi": "नियंत्रक एवं महालेखा परीक्षक (अनुच्छेद 148) की नियुक्ति राष्ट्रपति करते हैं और उसे सर्वोच्च न्यायालय के न्यायाधीश की तरह ही हटाया जा सकता है।"}, {"topic": "Polity", "en": "The Election Commission is established under Article 324, and the Finance Commission under Article 280 is constituted every five years.", "hi": "निर्वाचन आयोग अनुच्छेद 324 के तहत स्थापित है और वित्त आयोग (अनुच्छेद 280) हर पाँच वर्ष में गठित होता है।"}, {"topic": "Polity", "en": "Under Article 72 the President can pardon death sentences and court-martial sentences; the Governor’s pardoning power under Article 161 does not cover them.", "hi": "अनुच्छेद 72 के तहत राष्ट्रपति मृत्युदंड और कोर्ट-मार्शल की सजा माफ कर सकते हैं; अनुच्छेद 161 के तहत राज्यपाल की क्षमादान शक्ति इनमें लागू नहीं होती।"}, {"topic": "Polity", "en": "The Constituent Assembly took 2 years, 11 months and 18 days to frame the Constitution, which was adopted on 26 November 1949 and came into force on 26 January 1950.", "hi": "संविधान सभा को संविधान बनाने में 2 वर्ष, 11 माह, 18 दिन लगे; इसे 26 नवंबर 1949 को अपनाया गया और 26 जनवरी 1950 को लागू किया गया।"}, {"topic": "Polity", "en": "The President is elected by an electoral college under Article 54 through proportional representation by single transferable vote; nominated members of Parliament do not vote.", "hi": "राष्ट्रपति का चुनाव अनुच्छेद 54 के तहत निर्वाचक मंडल द्वारा एकल संक्रमणीय मत द्वारा आनुपातिक प्रतिनिधित्व से होता है; मनोनीत सांसद मतदान नहीं करते।"}, {"topic": "Polity", "en": "Article 356 deals with President’s Rule in a state, and the S. R. Bommai case (1994) laid down strict judicial review of its use.", "hi": "अनुच्छेद 356 राज्य में राष्ट्रपति शासन से संबंधित है, और एस. आर. बोम्मई मामले (1994) ने इसके प्रयोग की सख्त न्यायिक समीक्षा तय की।"}, {"topic": "Polity", "en": "The Right to Information Act was passed in 2005, and the Lokpal and Lokayuktas Act in 2013.", "hi": "सूचना का अधिकार अधिनियम 2005 में और लोकपाल एवं लोकायुक्त अधिनियम 2013 में पारित हुआ।"}, {"topic": "History", "en": "Dholavira in Gujarat, a UNESCO World Heritage Site since 2021, is known for the sophisticated water-conservation system of the Harappan civilisation.", "hi": "गुजरात का धोलावीरा, जो 2021 से यूनेस्को विश्व धरोहर है, हड़प्पा सभ्यता की उन्नत जल-संरक्षण प्रणाली के लिए प्रसिद्ध है।"}, {"topic": "History", "en": "Lothal in Gujarat had a Harappan dockyard, and Rakhigarhi in Haryana is the largest Harappan site in India.", "hi": "गुजरात के लोथल में हड़प्पाई गोदी (डॉकयार्ड) थी और हरियाणा का राखीगढ़ी भारत का सबसे बड़ा हड़प्पाई स्थल है।"}, {"topic": "History", "en": "The Rigveda, the oldest Veda, has 1,028 hymns arranged in 10 mandalas.", "hi": "ऋग्वेद, सबसे पुराना वेद, में 10 मंडलों में 1,028 सूक्त हैं।"}, {"topic": "History", "en": "Ashoka’s war on Kalinga took place around 261 BCE, and James Prinsep deciphered the Brahmi script of his edicts in 1837.", "hi": "अशोक का कलिंग युद्ध लगभग 261 ईसा पूर्व हुआ; उसके अभिलेखों की ब्राह्मी लिपि को जेम्स प्रिंसेप ने 1837 में पढ़ा।"}, {"topic": "History", "en": "Kautilya wrote the Arthashastra in the Mauryan period, and the Greek envoy Megasthenes wrote Indica.", "hi": "मौर्य काल में कौटिल्य ने अर्थशास्त्र लिखा और यूनानी राजदूत मेगस्थनीज़ ने इंडिका लिखी।"}, {"topic": "History", "en": "Samudragupta, called the ‘Napoleon of India’ by V. A. Smith, is praised in the Allahabad Pillar inscription composed by Harishena.", "hi": "वी. ए. स्मिथ ने समुद्रगुप्त को ‘भारत का नेपोलियन’ कहा; हरिषेण द्वारा रचित प्रयाग प्रशस्ति (इलाहाबाद स्तंभ लेख) में उनकी प्रशंसा है।"}, {"topic": "History", "en": "The Chola king Rajaraja I built the Brihadeeswarar Temple at Thanjavur, completed around 1010 CE.", "hi": "चोल राजा राजराज प्रथम ने तंजावुर का बृहदेश्वर मंदिर बनवाया, जो लगभग 1010 ई. में पूरा हुआ।"}, {"topic": "History", "en": "The three Battles of Panipat were fought in 1526 (Babur and Ibrahim Lodi), 1556 (Akbar’s forces and Hemu) and 1761 (the Marathas and Ahmad Shah Abdali).", "hi": "पानीपत की तीन लड़ाइयाँ 1526 (बाबर–इब्राहीम लोदी), 1556 (अकबर की सेना–हेमू) और 1761 (मराठे–अहमद शाह अब्दाली) में हुईं।"}, {"topic": "History", "en": "Sher Shah Suri defeated Humayun at Chausa (1539) and Kannauj (1540) and introduced the silver rupiya.", "hi": "शेरशाह सूरी ने हुमायूँ को चौसा (1539) और कन्नौज (1540) में हराया और चाँदी का रुपया चलाया।"}, {"topic": "History", "en": "Akbar’s land-revenue system Zabt was developed by Raja Todar Mal, and his Mansabdari system ranked officers by zat and sawar.", "hi": "अकबर की भू-राजस्व व्यवस्था ज़ब्त का विकास राजा टोडरमल ने किया; मनसबदारी में अधिकारियों का दर्जा ज़ात और सवार से तय होता था।"}, {"topic": "History", "en": "Alauddin Khalji started the systems of dagh (branding of horses) and chehra (descriptive rolls of soldiers) and controlled market prices.", "hi": "अलाउद्दीन खिलजी ने दाग (घोड़ों को दागना) और चेहरा (सैनिकों का हुलिया) प्रणाली शुरू की और बाज़ार मूल्य नियंत्रित किए।"}, {"topic": "History", "en": "Muhammad bin Tughlaq shifted his capital from Delhi to Daulatabad in 1327 and issued token currency.", "hi": "मुहम्मद बिन तुगलक ने 1327 में राजधानी दिल्ली से दौलताबाद बदली और सांकेतिक मुद्रा चलाई।"}, {"topic": "History", "en": "The Vijayanagara Empire was founded in 1336 by Harihara and Bukka, and its power broke at the Battle of Talikota in 1565.", "hi": "विजयनगर साम्राज्य की स्थापना 1336 में हरिहर और बुक्का ने की; तालीकोटा के युद्ध (1565) में इसकी शक्ति टूट गई।"}, {"topic": "History", "en": "Lord Cornwallis introduced the Permanent Settlement in 1793, Thomas Munro the Ryotwari system in Madras, and Holt Mackenzie the Mahalwari system in 1822.", "hi": "लॉर्ड कॉर्नवालिस ने 1793 में स्थायी बंदोबस्त, थॉमस मुनरो ने मद्रास में रैयतवाड़ी और होल्ट मैकेंज़ी ने 1822 में महालवाड़ी व्यवस्था लागू की।"}, {"topic": "History", "en": "Lord Dalhousie’s Doctrine of Lapse was used to annex Satara (1848), Jhansi (1853) and Nagpur (1854).", "hi": "लॉर्ड डलहौज़ी की हड़प नीति से सतारा (1848), झाँसी (1853) और नागपुर (1854) का विलय हुआ।"}, {"topic": "History", "en": "The Indian National Congress was founded in 1885 by A. O. Hume, and W. C. Bonnerjee presided over its first session in Bombay.", "hi": "भारतीय राष्ट्रीय कांग्रेस की स्थापना 1885 में ए. ओ. ह्यूम ने की; बंबई में पहले अधिवेशन की अध्यक्षता डब्ल्यू. सी. बनर्जी ने की।"}, {"topic": "History", "en": "The Partition of Bengal by Lord Curzon took effect on 16 October 1905 and was annulled in 1911.", "hi": "लॉर्ड कर्ज़न द्वारा बंगाल विभाजन 16 अक्टूबर 1905 को लागू हुआ और 1911 में रद्द कर दिया गया।"}, {"topic": "History", "en": "Gandhi’s first satyagraha in India was at Champaran (1917), followed by Kheda and the Ahmedabad mill strike in 1918.", "hi": "भारत में गांधीजी का पहला सत्याग्रह चंपारण (1917) में हुआ, फिर 1918 में खेड़ा और अहमदाबाद मिल हड़ताल।"}, {"topic": "History", "en": "The Chauri Chaura incident of 5 February 1922 made Gandhi withdraw the Non-Cooperation Movement.", "hi": "5 फरवरी 1922 की चौरी-चौरा घटना के बाद गांधीजी ने असहयोग आंदोलन वापस ले लिया।"}, {"topic": "History", "en": "The Poona Pact (1932) was signed between Gandhi and Dr B. R. Ambedkar after the Communal Award.", "hi": "सांप्रदायिक पंचाट के बाद गांधीजी और डॉ. अंबेडकर के बीच पूना समझौता (1932) हुआ।"}, {"topic": "History", "en": "The Cabinet Mission of 1946 had three members: Pethick-Lawrence, Stafford Cripps and A. V. Alexander.", "hi": "1946 के कैबिनेट मिशन में तीन सदस्य थे: पेथिक-लॉरेंस, स्टैफर्ड क्रिप्स और ए. वी. अलेक्जेंडर।"}, {"topic": "Geography", "en": "The Tropic of Cancer (23.5°N) passes through eight Indian states: Gujarat, Rajasthan, Madhya Pradesh, Chhattisgarh, Jharkhand, West Bengal, Tripura and Mizoram.", "hi": "कर्क रेखा (23.5°उ.) भारत के आठ राज्यों से गुजरती है: गुजरात, राजस्थान, मध्य प्रदेश, छत्तीसगढ़, झारखंड, पश्चिम बंगाल, त्रिपुरा और मिज़ोरम।"}, {"topic": "Geography", "en": "India’s Standard Meridian is 82°30′E, which passes near Mirzapur in Uttar Pradesh, and IST is 5 hours 30 minutes ahead of GMT.", "hi": "भारत की मानक याम्योत्तर 82°30′ पूर्व है, जो उत्तर प्रदेश के मिर्ज़ापुर के पास से गुजरती है, और IST ग्रीनविच समय से 5 घंटे 30 मिनट आगे है।"}, {"topic": "Geography", "en": "Kanchenjunga (8,586 m) is the highest peak in India, and Anamudi (2,695 m) in Kerala is the highest peak of peninsular India.", "hi": "कंचनजंगा (8,586 मी.) भारत की सबसे ऊँची चोटी है, और केरल की अनामुडी (2,695 मी.) प्रायद्वीपीय भारत की सबसे ऊँची चोटी है।"}, {"topic": "Geography", "en": "The Narmada and Tapi flow west into the Arabian Sea through rift valleys and form estuaries instead of deltas.", "hi": "नर्मदा और ताप्ती भ्रंश घाटियों से होकर पश्चिम में अरब सागर में गिरती हैं और डेल्टा के बजाय ज्वारनदमुख बनाती हैं।"}, {"topic": "Geography", "en": "Chilika in Odisha is the largest coastal lagoon in India, and Wular in Jammu and Kashmir is the largest freshwater lake.", "hi": "ओडिशा की चिल्का भारत की सबसे बड़ी तटीय लैगून झील है और जम्मू-कश्मीर की वुलर सबसे बड़ी मीठे पानी की झील है।"}, {"topic": "Geography", "en": "The Ganga is formed at Devprayag in Uttarakhand by the meeting of the Alaknanda and the Bhagirathi.", "hi": "गंगा का निर्माण उत्तराखंड के देवप्रयाग में अलकनंदा और भागीरथी के संगम से होता है।"}, {"topic": "Geography", "en": "The Brahmaputra is called Tsangpo in Tibet and Jamuna in Bangladesh.", "hi": "ब्रह्मपुत्र को तिब्बत में सांगपो और बांग्लादेश में जमुना कहते हैं।"}, {"topic": "Geography", "en": "Black soil (regur) forms from basaltic lava and suits cotton; it is rich in lime, iron and magnesium but poor in nitrogen, phosphorus and organic matter.", "hi": "काली मिट्टी (रेगुर) बेसाल्ट लावा से बनती है और कपास के लिए उपयुक्त है; इसमें चूना, लोहा और मैग्नीशियम अधिक, पर नाइट्रोजन, फॉस्फोरस और जैविक पदार्थ कम होते हैं।"}, {"topic": "Geography", "en": "The Hirakud Dam on the Mahanadi in Odisha is among the longest earthen dams in the world.", "hi": "ओडिशा में महानदी पर बना हीराकुंड बाँध दुनिया के सबसे लंबे मिट्टी के बाँधों में से एक है।"}, {"topic": "Geography", "en": "The Palk Strait separates India and Sri Lanka, and the Ten Degree Channel separates the Andaman and Nicobar Islands.", "hi": "पाक जलडमरूमध्य भारत और श्रीलंका को अलग करता है, और दस डिग्री चैनल अंडमान और निकोबार द्वीप समूह को अलग करता है।"}, {"topic": "Geography", "en": "Mawsynram in Meghalaya’s Khasi Hills is recorded as one of the wettest places on Earth.", "hi": "मेघालय की खासी पहाड़ियों में स्थित मॉसिनराम पृथ्वी के सबसे अधिक वर्षा वाले स्थानों में गिना जाता है।"}, {"topic": "Geography", "en": "The Aravalli range is among the oldest fold mountains in the world, while the Himalayas are among the youngest.", "hi": "अरावली दुनिया की सबसे पुरानी वलित पर्वतमालाओं में से एक है, जबकि हिमालय सबसे नई में से एक है।"}, {"topic": "Economy", "en": "The Reserve Bank of India was established on 1 April 1935 under the RBI Act 1934 and was nationalised on 1 January 1949.", "hi": "भारतीय रिज़र्व बैंक की स्थापना RBI अधिनियम 1934 के तहत 1 अप्रैल 1935 को हुई और इसका राष्ट्रीयकरण 1 जनवरी 1949 को हुआ।"}, {"topic": "Economy", "en": "The repo rate is the rate at which the RBI lends short-term money to banks, and the reverse repo rate is the rate at which it borrows from banks.", "hi": "रेपो दर वह दर है जिस पर RBI बैंकों को अल्पकालिक ऋण देता है, और रिवर्स रेपो दर वह दर है जिस पर वह बैंकों से उधार लेता है।"}, {"topic": "Economy", "en": "The Fiscal Responsibility and Budget Management (FRBM) Act was enacted in 2003 to bring fiscal discipline.", "hi": "राजकोषीय अनुशासन लाने के लिए राजकोषीय उत्तरदायित्व और बजट प्रबंधन (FRBM) अधिनियम 2003 में बना।"}, {"topic": "Economy", "en": "NABARD was established on 12 July 1982 on the recommendation of the Shivaraman Committee.", "hi": "नाबार्ड की स्थापना शिवरामन समिति की सिफारिश पर 12 जुलाई 1982 को हुई।"}, {"topic": "Economy", "en": "NITI Aayog replaced the Planning Commission on 1 January 2015.", "hi": "नीति आयोग ने 1 जनवरी 2015 को योजना आयोग का स्थान लिया।"}, {"topic": "Economy", "en": "The First Five-Year Plan (1951–56) was based on the Harrod–Domar model, and the Second Plan (1956–61) on the Mahalanobis model.", "hi": "पहली पंचवर्षीय योजना (1951–56) हैरोड–डोमर मॉडल पर और दूसरी योजना (1956–61) महालनोबिस मॉडल पर आधारित थी।"}, {"topic": "Economy", "en": "India nationalised 14 major banks in 1969 and 6 more in 1980.", "hi": "भारत ने 1969 में 14 प्रमुख बैंकों का और 1980 में 6 और बैंकों का राष्ट्रीयकरण किया।"}, {"topic": "Economy", "en": "Minimum Support Prices are announced by the Government of India on the recommendation of the Commission for Agricultural Costs and Prices (CACP).", "hi": "न्यूनतम समर्थन मूल्य भारत सरकार कृषि लागत एवं मूल्य आयोग (CACP) की सिफारिश पर घोषित करती है।"}, {"topic": "StaticGK", "en": "The Jnanpith Award was first given in 1965 to the Malayalam poet G. Sankara Kurup.", "hi": "ज्ञानपीठ पुरस्कार पहली बार 1965 में मलयालम कवि जी. शंकर कुरुप को दिया गया।"}, {"topic": "StaticGK", "en": "The Dadasaheb Phalke Award was first given in 1969 to the actress Devika Rani.", "hi": "दादासाहेब फाल्के पुरस्कार पहली बार 1969 में अभिनेत्री देविका रानी को दिया गया।"}, {"topic": "StaticGK", "en": "Kalidasa wrote Abhijnanashakuntalam, Bharavi wrote Kiratarjuniya, and Banabhatta wrote Harshacharita.", "hi": "कालिदास ने अभिज्ञानशाकुंतलम्, भारवि ने किरातार्जुनीयम् और बाणभट्ट ने हर्षचरित लिखा।"}, {"topic": "StaticGK", "en": "Kalhana’s Rajatarangini is a chronicle of the kings of Kashmir.", "hi": "कल्हण की राजतरंगिणी कश्मीर के राजाओं का इतिहास-ग्रंथ है।"}, {"topic": "StaticGK", "en": "The Kailasa Temple at Ellora in Maharashtra was built under the Rashtrakuta king Krishna I.", "hi": "महाराष्ट्र के एलोरा का कैलाश मंदिर राष्ट्रकूट राजा कृष्ण प्रथम के समय बना।"}, {"topic": "StaticGK", "en": "The Khajuraho temples were built by the Chandela rulers, and the Sun Temple at Modhera in Gujarat by the Solanki dynasty.", "hi": "खजुराहो के मंदिर चंदेल शासकों ने और गुजरात का मोढेरा सूर्य मंदिर सोलंकी वंश ने बनवाया।"}, {"topic": "StaticGK", "en": "Sattriya, the dance tradition of Assam, was recognised as a classical dance by the Sangeet Natak Akademi in 2000.", "hi": "असम की नृत्य परंपरा सत्त्रिया को संगीत नाटक अकादमी ने 2000 में शास्त्रीय नृत्य का दर्जा दिया।"}, {"topic": "StaticGK", "en": "Amartya Sen won the Nobel Prize in Economics in 1998, and Abhijit Banerjee shared it in 2019.", "hi": "अमर्त्य सेन ने 1998 में अर्थशास्त्र का नोबेल जीता, और अभिजीत बनर्जी ने 2019 में यह साझा रूप से जीता।"}, {"topic": "UPGK", "en": "Uttar Pradesh has 75 districts and 18 administrative divisions.", "hi": "उत्तर प्रदेश में 75 जिले और 18 मंडल हैं।"}, {"topic": "UPGK", "en": "The United Provinces of Agra and Oudh was renamed Uttar Pradesh on 24 January 1950.", "hi": "संयुक्त प्रांत (आगरा और अवध) का नाम 24 जनवरी 1950 को उत्तर प्रदेश रखा गया।"}, {"topic": "UPGK", "en": "The Allahabad High Court was established on 17 March 1866 at Agra, shifted to Allahabad in 1869, and has a bench at Lucknow.", "hi": "इलाहाबाद उच्च न्यायालय की स्थापना 17 मार्च 1866 को आगरा में हुई, 1869 में इलाहाबाद आया, और इसकी एक पीठ लखनऊ में है।"}, {"topic": "UPGK", "en": "The Allahabad High Court has the largest sanctioned strength of judges (160) among the High Courts of India.", "hi": "भारत के उच्च न्यायालयों में इलाहाबाद उच्च न्यायालय में न्यायाधीशों के स्वीकृत पद (160) सबसे अधिक हैं।"}, {"topic": "UPGK", "en": "Lakhimpur Kheri is the largest district of Uttar Pradesh by area, and it has the Dudhwa National Park, known for the barasingha (swamp deer).", "hi": "लखीमपुर खीरी क्षेत्रफल में उत्तर प्रदेश का सबसे बड़ा जिला है, और यहाँ दुधवा राष्ट्रीय उद्यान है जो बारहसिंगा (दलदली हिरण) के लिए प्रसिद्ध है।"}, {"topic": "UPGK", "en": "The Chauri Chaura incident (1922) took place in Gorakhpur district, and the Kakori train action took place near Lucknow on 9 August 1925.", "hi": "चौरी-चौरा की घटना (1922) गोरखपुर जिले में हुई, और काकोरी ट्रेन एक्शन 9 अगस्त 1925 को लखनऊ के पास हुआ।"}, {"topic": "UPGK", "en": "The Revolt of 1857 began at Meerut on 10 May 1857.", "hi": "1857 का विद्रोह 10 मई 1857 को मेरठ से शुरू हुआ।"}, {"topic": "UPGK", "en": "Sarnath near Varanasi is where the Buddha gave his first sermon, and its Ashoka Lion Capital is the basis of India’s national emblem.", "hi": "वाराणसी के पास सारनाथ में बुद्ध ने पहला उपदेश दिया था, और यहाँ का अशोक सिंह-स्तंभ शीर्ष भारत के राष्ट्रीय चिह्न का आधार है।"}, {"topic": "UPGK", "en": "The Taj Mahal, Agra Fort and Fatehpur Sikri, all in the Agra region, are UNESCO World Heritage Sites.", "hi": "आगरा क्षेत्र के ताजमहल, आगरा किला और फतेहपुर सीकरी यूनेस्को विश्व धरोहर स्थल हैं।"}, {"topic": "UPGK", "en": "The Uttar Pradesh Vidhan Sabha has 403 members and the Vidhan Parishad has 100; the state sends 80 members to the Lok Sabha and 31 to the Rajya Sabha.", "hi": "उत्तर प्रदेश विधानसभा में 403 और विधान परिषद में 100 सदस्य हैं; राज्य से लोकसभा में 80 और राज्यसभा में 31 सदस्य जाते हैं।"}, {"topic": "UPGK", "en": "Govind Ballabh Pant was the first Chief Minister of Uttar Pradesh after 1950, and Sucheta Kripalani became India’s first woman Chief Minister in Uttar Pradesh in 1963.", "hi": "गोविंद बल्लभ पंत 1950 के बाद उत्तर प्रदेश के पहले मुख्यमंत्री थे, और सुचेता कृपलानी 1963 में उत्तर प्रदेश में भारत की पहली महिला मुख्यमंत्री बनीं।"}, {"topic": "UPGK", "en": "Banaras Hindu University was founded in 1916 by Madan Mohan Malaviya, and Aligarh Muslim University received university status in 1920.", "hi": "बनारस हिंदू विश्वविद्यालय की स्थापना 1916 में मदन मोहन मालवीय ने की, और अलीगढ़ मुस्लिम विश्वविद्यालय को 1920 में विश्वविद्यालय का दर्जा मिला।"}, {"topic": "UPGK", "en": "The Upper Ganga Canal, built under Proby Cautley, was opened in 1854 and irrigates the doab region of Uttar Pradesh.", "hi": "प्रोबी कॉटले के नेतृत्व में बनी ऊपरी गंगा नहर 1854 में खुली और उत्तर प्रदेश के दोआब क्षेत्र की सिंचाई करती है।"}, {"topic": "UPGK", "en": "The Kumbh Mela is held at Prayagraj, Haridwar, Ujjain and Nashik, and the Maha Kumbh at Prayagraj comes once in 12 years.", "hi": "कुंभ मेला प्रयागराज, हरिद्वार, उज्जैन और नासिक में लगता है, और प्रयागराज का महाकुंभ 12 वर्ष में एक बार आता है।"}];
const GYTOP={Science:'🔬 General Science / सामान्य विज्ञान',Polity:'🏛️ Polity / राजव्यवस्था',History:'📜 History / इतिहास',Geography:'🌍 Geography / भूगोल',Economy:'💰 Economy / अर्थव्यवस्था',StaticGK:'📚 Static GK / स्टैटिक जीके',UPGK:'📍 UP GK / यूपी जीके'};
const GYMIX=(()=>{const g={},o=[];GYF.forEach(f=>(g[f.topic]=g[f.topic]||[]).push(f));const L=Object.values(g);for(let r=0;o.length<GYF.length;r++)L.forEach(l=>{if(r<l.length)o.push(l[r])});return o})();
const gyIdx=d=>Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2024,0,1))/864e5);
const GY_EVERY=2,GY_PAT=[0,0,0,1,0,0,0,2];
const gyPick=(L,c,st)=>{const n=L.length;if(gcd(st,n)!=1)st=1;return L[(((c*st)%n)+n)%n]};
// k = how many PYQ days so far; each type (vocab / OWS / idiom) has its own cycle, so nothing is skipped
const gyPyq=k=>{const pl=GY_PAT.length,p=((k%pl)+pl)%pl,kind=GY_PAT[p],per=GY_PAT.filter(x=>x==kind).length,rank=GY_PAT.slice(0,p).filter(x=>x==kind).length,c=Math.trunc(k/pl)*per+rank,L=kind==1?GYPO:kind==2?GYPI:GYPW;return gyPick(L.length?L:GYPW,c,7)};
const gyWord=d=>{const di=gyIdx(d);if(GY_EVERY>0&&GYPW.length){if(((di%GY_EVERY)+GY_EVERY)%GY_EVERY==0)return gyPyq(Math.trunc(di/GY_EVERY));return gyPick(GYW,di-Math.trunc(di/GY_EVERY)-1,37)}return gyPick(GYW,di,37)};
const gySp=w=>w.pos=='OWS'||w.pos=='idiom',gyKind=w=>w.pos=='OWS'?'One Word Substitution':w.pos=='idiom'?'Idiom & Phrase':'',
 gyHead=w=>gySp(w)?w.word:`${w.word} (${w.pos})`,gyPq=w=>['AHC RO/ARO PYQ',gyKind(w),w.src||''].filter(Boolean).join(' · '),
 gyBadge=w=>w.src?`<div style="margin-bottom:6px"><span style="display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;color:var(--ac);background:var(--card);border:1px solid var(--ac);background:color-mix(in srgb,var(--ac) 15%,transparent);border:1px solid color-mix(in srgb,var(--ac) 50%,transparent)">🎯 ${esc(gyPq(w))}</span></div>`:'';
const gyFact=d=>GYMIX[((gyIdx(d)%GYMIX.length)+GYMIX.length)%GYMIX.length];
const gySA=(l,a,c)=>a.length?`<div style="font-size:12.5px;margin-top:4px"><b style="color:${c}">${l}: </b><span class="mu">${a.map(esc).join(', ')}</span></div>`:'';
function gyanCard(){const d=new Date(),W=gyWord(d),F=gyFact(d),tg=GYTOP[F.topic]||'';
 return `<div class="card gyan"><div class="row" style="margin:0;justify-content:space-between"><b>📖 Word of the Day / आज का शब्द</b><span><a class="material-icons" style="padding:6px;cursor:pointer;color:var(--tx70)" onclick="gyPast()" title="Last 7 days">history</a><a class="material-icons" style="padding:6px;cursor:pointer;color:var(--tx70)" onclick="gyShare()" title="Share">share</a></span></div>
 <div style="background:var(--card2);border-radius:12px;padding:12px;margin-top:8px">${gyBadge(W)}<div><span class="gw" style="font-size:22px">${esc(W.word)}</span>${gySp(W)?'':` <i class="mu" style="font-size:12.5px">${esc(W.pos)}</i>`}</div><div><b>${esc(W.hi)}</b></div><div class="mu">${esc(W.pos=='OWS'?'One word for: '+W.en:W.en)}</div>${gySA('Synonyms',W.syn,'var(--okc)')}${gySA('Antonyms',W.ant,'var(--bad)')}<div class="mu" style="margin-top:6px;font-size:12.5px"><i>“${esc(W.example)}”</i></div></div>
 <div style="margin-top:10px"><b style="font-size:13px">💡 Did you know? / क्या आप जानते हैं?</b></div>${tg?`<div style="color:var(--ac);font-size:11.5px;font-weight:600">${tg}</div>`:''}<p style="margin:4px 0 2px;font-size:13px">${esc(F.en)}</p><p class="mu" style="margin:2px 0;font-size:13px">${esc(F.hi)}</p></div>`}
function gyShare(){const d=new Date(),W=gyWord(d),F=gyFact(d),ti=W.pos=='OWS'?'One Word Substitution: '+W.word:W.pos=='idiom'?'Idiom: '+W.word:'Word of the Day: '+W.word,
 first=gySp(W)?`${W.word} = ${W.en} (${W.hi})\n`:`${W.word} (${W.pos}) = ${W.hi} (${W.en})\n`,
 tx=`📖 ${ti}\n`+first+(W.src?`🎯 ${gyPq(W)}\n`:'')+(W.syn.length?`Synonyms: ${W.syn.join(', ')}\n`:'')+(W.ant.length?`Antonyms: ${W.ant.join(', ')}\n`:'')+`Example: ${W.example}\n\n💡 ${F.en}\n${F.hi}`;
 if(navigator.share)navigator.share({title:ti,text:tx}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(tx).then(()=>toast('Copied! / कॉपी हो गया'));else toast(tx)}
function gyPast(){const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],n=new Date();let h='';
 for(let i=0;i<7;i++){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()-i),W=gyWord(d),F=gyFact(d);h+=`<div class="card" style="margin:0 0 10px"><div class="mu" style="font-size:11px">${i==0?'Today / आज':i==1?'Yesterday / कल':d.getDate()+' '+M[d.getMonth()]}</div><div style="color:var(--ac);font-weight:700;font-size:14px">${esc(gyHead(W))} - ${esc(W.hi)}</div><div class="mu" style="font-size:12.5px">${esc(W.en)}</div>${W.src?`<div style="color:var(--ac);font-size:11.5px;font-weight:600">🎯 ${esc(gyPq(W))}</div>`:''}${W.syn.length?`<div class="mu" style="font-size:12px">Syn: ${W.syn.map(esc).join(', ')}</div>`:''}${W.ant.length?`<div class="mu" style="font-size:12px">Ant: ${W.ant.map(esc).join(', ')}</div>`:''}<div style="font-size:12.5px;margin-top:6px">💡 ${esc(F.en)}</div><div class="mu" style="font-size:12.5px">${esc(F.hi)}</div></div>`}
 const o=document.createElement('div');o.id='gyov';o.style.cssText='position:fixed;inset:0;z-index:50;background:#0008;display:flex;align-items:flex-end';o.onclick=e=>{if(e.target===o)o.remove()};

async function bchk(id,code){
 const em=String(auth.currentUser.email||'').trim().toLowerCase();
 try{const sn=await db.doc(`batchAccess/${em}_${id}`).get(),a=sn.exists?sn.data():null;
  if(!a||a.status!='granted')return{};
  /* Same login ID = same access on App and Web. The access code is only stored on the
     device where it was typed (App: phone, Web: this browser), so a batch bought / unlocked
     in the App has no code in the Web browser. This record is readable ONLY by the account
     whose email is in the document id (Firestore rules: isMyAccessId), and it is 'granted'
     by the admin, so the logged-in email is enough — no code needed on Web. */
  const exp=a.expiresAt?a.expiresAt.toDate():null;
  if(exp&&new Date()>=exp)return{expired:true,exp};
  return{granted:true,exp}
 }catch(e){if(e&&e.code=='permission-denied')return{expired:true};throw e}}

const SP={c:null,x:null,raf:0,last:0,run:false,w:0,h:0,stars:[],ast:[]};
function themeDark(){return document.documentElement.getAttribute('data-theme')=='dark'}
function applyTheme(d){const h=document.documentElement;if(d)h.setAttribute('data-theme','dark');else h.removeAttribute('data-theme');
 try{localStorage.setItem('theme',d?'dark':'light')}catch(e){}

function spaceSize(){const c=SP.c,d=Math.min(window.devicePixelRatio||1,2);SP.w=innerWidth;SP.h=innerHeight;c.width=Math.round(SP.w*d);c.height=Math.round(SP.h*d);SP.x.setTransform(d,0,0,d,0,0);
 SP.stars=Array.from({length:Math.min(Math.round(SP.w*SP.h/9000),170)},()=>({x:Math.random()*SP.w,y:Math.random()*SP.h,r:Math.random()*1.2+.3,p:Math.random()*6.28,s:.5+Math.random()*1.3}));
 SP.ast=Array.from({length:4},()=>({x:Math.random()*SP.w,y:Math.random()*SP.h,r:8+Math.random()*10,vx:3+Math.random()*5,vy:1+Math.random()*3,rot:Math.random()*6,vr:(Math.random()-.5)*.2,sh:Array.from({length:7},()=>.75+Math.random()*.35)}));spaceDraw(0)}
function spaceDraw(t){const x=SP.x;if(!x)return;x.clearRect(0,0,SP.w,SP.h);
 for(const s of SP.stars){x.globalAlpha=.35+.65*Math.abs(Math.sin(t*s.s*.7+s.p));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill()}
 x.globalAlpha=.85;x.fillStyle='#2e3040';
 for(const a of SP.ast){const W=SP.w+60,H=SP.h+60,px=(((a.x+a.vx*t)%W)+W)%W-30,py=(((a.y+a.vy*t)%H)+H)%H-30;x.save();x.translate(px,py);x.rotate(a.rot+a.vr*t);x.beginPath();a.sh.forEach((m,k)=>{const an=k/7*6.283,X=Math.cos(an)*a.r*m,Y=Math.sin(an)*a.r*m;k?x.lineTo(X,Y):x.moveTo(X,Y)});x.closePath();x.fill();x.restore()}
 x.globalAlpha=1}
function spaceLoop(ms){SP.raf=0;if(!SP.run)return;if(ms-SP.last>=40){SP.last=ms;spaceDraw(ms/1000)}SP.raf=requestAnimationFrame(spaceLoop)}

async function dlSaveCurrent(btn){
 const cur=window.CUR_PDF;if(!cur||btn&&btn.dataset.busy)return;
 const id=dlIdFor(cur.url);
 try{
  const ex=await dlGet(id);
  if(ex){dlPopup(ex.title,true,ex.mode==='blob');return}
  if(btn){btn.dataset.busy='1';btn.innerHTML='<span class="material-icons">hourglass_top</span>'}
  toast('Downloading to Web Downloads… / डाउनलोड हो रहा है…',8000);
  let blob=null,mode='link',size=0;
  // Try fetching actual PDF binary for true offline viewing (succeeds for jsDelivr/direct PDFs; Google Drive falls back cleanly to in-web link)
  try{
   const resp=await fetch(cur.dl||cur.url,{mode:'cors',credentials:'omit'});
   if(resp.ok){
    const b=await resp.blob();
    if(b&&b.size>100){
     const head=new Uint8Array(await b.slice(0,5).arrayBuffer());
     const isPdf=(head[0]===0x25&&head[1]===0x50&&head[2]===0x44&&head[3]===0x46)||/pdf/i.test(b.type||'');
     if(isPdf){blob=b;mode='blob';size=b.size}
    }
   }
  }catch(e){}
  await dlPut({id,title:cur.title||'PDF',url:cur.url,src:cur.src,paid:!!cur.paid,mode,blob,size,savedAt:Date.now()});
  if(btn){btn.innerHTML='<span class="material-icons" style="color:var(--yel)">download_done</span>'}
  dlPopup(cur.title||'PDF',false,mode==='blob');
 }catch(e){
  if(btn)btn.innerHTML='<span class="material-icons">download</span>';
  alert('Download failed: '+(e.message||e));
 }finally{if(btn)delete btn.dataset.busy}
}

// PDF.js lazy loader (cached by sw.js for 100% offline canvas rendering on Android/iOS/Desktop)
function dlLoadPdfJs(){
 if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
 if(window._pdfjsP)return window._pdfjsP;
 window._pdfjsP=new Promise((res,rej)=>{
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
  s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';res(window.pdfjsLib)}catch(e){rej(e)}};
  s.onerror=()=>rej(new Error('PDF viewer script could not load. Connect to internet once to cache it.'));
  document.head.appendChild(s);
 });
 return window._pdfjsP;
}

async function dlRenderCanvas(doc,scale){
 const box=document.getElementById('dlvc');if(!box)return;
 box.innerHTML='';
 const dpr=Math.min(window.devicePixelRatio||1,2);
 const baseW=Math.max(280,(box.clientWidth||window.innerWidth-32)-8);
 for(let n=1;n<=doc.numPages;n++){
  if(!document.getElementById('dlvc'))return;
  const page=await doc.getPage(n);
  const vp0=page.getViewport({scale:1});
  const fitScale=(baseW/vp0.width)*scale;
  const vp=page.getViewport({scale:fitScale});
  const wrapDiv=document.createElement('div');
  wrapDiv.style.cssText='margin:0 auto 12px;text-align:center';
  const cv=document.createElement('canvas');
  cv.width=Math.floor(vp.width*dpr);cv.height=Math.floor(vp.height*dpr);
  cv.style.cssText=`width:${Math.floor(vp.width)}px;height:${Math.floor(vp.height)}px;max-width:none;background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.15);display:block;margin:0 auto`;
  cv.oncontextmenu=()=>false;
  const ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  wrapDiv.appendChild(cv);
  const cap=document.createElement('small');cap.className='mu';cap.textContent=`Page ${n} / ${doc.numPages}`;
  wrapDiv.appendChild(cap);
  box.appendChild(wrapDiv);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
 }
}
