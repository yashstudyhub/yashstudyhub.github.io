function qHtml(Q,prefix,hi){window.QS=window.QS||{};QS[prefix]=Q;const sv=J.get('bookmarks',[]);return Q.map((q,i)=>`<div class="q">${q.passage?`<p class="mu">${esc(qt(q,'passage',hi))}</p>`:''}<b>${i+1}. ${esc(qt(q,'text',hi))}</b>`+(hi&&q.optionsHi?.length?q.optionsHi:q.options).map((o,j)=>`<label><input type="radio" name="${prefix}${i}" value="${j}">${esc(o)}</label>`).join('')+`<div id="${prefix}x${i}"></div><button class="s" style="margin-top:6px" onclick="bm('${prefix}',${i},this)">${sv.some(x=>x.text===q.text)?'★ Saved':'☆ Save'}</button></div>`).join('')}
function grade(Q,prefix,mp,ng,hi){let s=0,c=0,w=0;const ans=[];
 Q.forEach((q,i)=>{const r=document.querySelector(`input[name=${prefix}${i}]:checked`),a=r?+r.value:null;ans.push(a);
  document.querySelectorAll(`input[name=${prefix}${i}]`).forEach(e=>{e.disabled=true;const p=e.parentElement;if(+e.value==q.correctIndex)p.classList.add('ok');else if(+e.value==a)p.classList.add('no')});
  if(a!==null){if(a==q.correctIndex){c++;s+=mp}else{w++;s-=ng}}
  const ex=hi&&q.explanationHi||q.explanation;if(ex)document.getElementById(prefix+'x'+i).innerHTML='<p class="mu">💡 '+esc(ex)+'</p>'});
 return {s,c,w,ans}}

ै (नेपाल-चीन ने 2020 में नापी)।"},{"en":"India became the most populous country in 2023, according to UN estimates.","hi":"UN के अनुमान के अनुसार भारत 2023 में सबसे अधिक आबादी वाला देश बना।"},{"en":"Neeraj Chopra won gold in javelin at the Tokyo Olympics, India’s first Olympic gold in athletics.","hi":"नीरज चोपड़ा ने टोक्यो ओलंपिक में भाला फेंक में स्वर्ण जीता, एथलेटिक्स में भारत का पहला ओलंपिक स्वर्ण।"},{"en":"India won the Cricket World Cup in 1983 (Kapil Dev) and 2011 (M. S. Dhoni).","hi":"भारत ने क्रिकेट विश्व कप 1983 (कपिल देव) और 2011 (एम. एस. धोनी) में जीता।"},{"en":"India has won 8 Olympic gold medals in hockey (1928 to 1980).","hi":"भारत ने हॉकी में 8 ओलंपिक स्वर्ण पदक जीते हैं (1928 से 1980)।"},{"en":"National Sports Day is on 29 August, the birthday of Major Dhyan Chand.","hi":"राष्ट्रीय खेल दिवस 29 अगस्त को मेजर ध्यानचंद के जन्मदिन पर मनाया जाता है।"},{"en":"Teachers' Day is on 5 September; Children's Day on 14 November.","hi":"शिक्षक दिवस 5 सितंबर और बाल दिवस 14 नवंबर को मनाया जाता है।"},{"en":"National Youth Day (12 January) marks the birth of Swami Vivekananda.","hi":"राष्ट्रीय युवा दिवस (12 जनवरी) स्वामी विवेकानंद की जयंती पर मनाया जाता है।"},{"en":"World Environment Day is on 5 June and World Health Day on 7 April.","hi":"विश्व पर्यावरण दिवस 5 जून और विश्व स्वास्थ्य दिवस 7 अप्रैल को होता है।"},{"en":"Aravalli is among the oldest fold mountains in the world; the Himalayas are among the youngest.","hi":"अरावली विश्व की सबसे पुरानी वलित पर्वतमालाओं में है; हिमालय सबसे नई में से एक है।"},{"en":"The Sundarbans is the largest mangrove forest in the world and home to the Bengal tiger.","hi":"सुंदरबन विश्व का सबसे बड़ा मैंग्रोव वन है और बंगाल टाइगर का घर है।"},{"en":"Kaziranga (Assam) is famous for the one-horned rhinoceros; Gir (Gujarat) for the Asiatic lion.","hi":"काजीरंगा (असम) एक सींग वाले गैंडे और गिर (गुजरात) एशियाई शेर के लिए प्रसिद्ध है।"},{"en":"Jim Corbett is India's oldest national park (established 1936).","hi":"जिम कॉर्बेट भारत का सबसे पुराना राष्ट्रीय उद्यान है (1936)।"},{"en":"Charles Babbage is called the Father of the Computer; Tim Berners-Lee invented the World Wide Web.","hi":"चार्ल्स बैबेज को कंप्यूटर का जनक कहते हैं; टिम बर्नर्स-ली ने वर्ल्ड वाइड वेब बनाया।"},{"en":"Digital India was launched on 1 July 2015 and the Jan Dhan Yojana on 28 August 2014.","hi":"डिजिटल इंडिया 1 जुलाई 2015 और जन धन योजना 28 अगस्त 2014 को शुरू हुई।"},{"en":"UPI was launched by NPCI in 2016 and changed how India pays.","hi":"UPI को NPCI ने 2016 में शुरू किया और इसने भारत में भुगतान का तरीका बदल दिया।"},{"en":"G. V. Mavalankar was the first Speaker of the Lok Sabha.","hi":"जी. वी. मावलंकर लोकसभा के पहले अध्यक्ष थे।"},{"en":"Rakesh Sharma became the first Indian to travel to space in 1984.","hi":"राकेश शर्मा 1984 में अंतरिक्ष जाने वाले पहले भारतीय बने।"},{"en":"Viswanathan Anand became India’s first chess Grandmaster in 1988.","hi":"विश्वनाथन आनंद 1988 में भारत के पहले शतरंज ग्रैंडमास्टर बने।"},{"en":"NH 44 (Srinagar to Kanyakumari) is the longest national highway in India.","hi":"NH 44 (श्रीनगर से कन्याकुमारी) भारत का सबसे लंबा राष्ट्रीय राजमार्ग है।"},{"en":"Brahmagupta (628 CE) gave rules for using zero as a number.","hi":"ब्रह्मगुप्त (628 ई.) ने शून्य को एक संख्या की तरह इस्तेमाल करने के नियम दिए।"}],"fcats":{"polity":["Polity","राजव्यवस्था","🏛️"],"geo":["Geography","भूगोल","🌏"],"history":["History","इतिहास","📜"],"science":["Science","विज्ञान","🔬"],"economy":["Economy","अर्थव्यवस्था","💰"],"maths":["Maths Formulas","गणित सूत्र","➗"],"english":["One-Word / English","एक शब्द / अंग्रेज़ी","📖"]},"cards":[{"id":"p01","cat":"polity","q":"Who is called the 'Father of the Indian Constitution'?","qh":"भारतीय संविधान का जनक किसे कहा जाता है?","a":"Dr. B. R. Ambedkar (Chairman of the Drafting Committee).","ah":"डॉ. बी. आर. आंबेडकर (प्रारूप समिति के अध्यक्ष)।"},{"id":"p02","cat":"polity","q":"When did the Constitution of India come into effect?","qh":"भारत का संविधान कब लागू हुआ?","a":"26 January 1950 (it was adopted on 26 November 1949).","ah":"26 जनवरी 1950 (इसे 26 नवंबर 1949 को अपनाया गया था)।"},{"id":"p03","cat":"polity","q":"Article 14 deals with?","qh":"अनुच्छेद 14 किससे संबंधित है?","a":"Equality before law and equal protection of the laws.","ah":"विधि के समक्ष समानता और कानूनों का समान संरक्षण।"},{"id":"p04","cat":"polity","q":"Article 21 guarantees?","qh":"अनुच्छेद 21 क्या गारंटी देता है?","a":"Right to life and personal liberty.","ah":"प्राण और दैहिक स्वतंत्रता का अधिकार।"},{"id":"p05","cat":"polity","q":"Article 21A and which amendment added it?","qh":"अनुच्छेद 21A क्या है और किस संशोधन से जुड़ा?","a":"Right to free and compulsory education for ages 6-14; 86th Amendment (2002).","ah":"6-14 वर्ष के बच्चों को निःशुल्क व अनिवार्य शिक्षा; 86वाँ संशोधन (2002)।"},{"id":"p06","cat":"polity","q":"Which Article is the 'Right to Constitutional Remedies'?","qh":"संवैधानिक उपचारों का अधिकार कौन-सा अनुच्छेद है?","a":"Article 32 (Dr. Ambedkar called it the heart and soul of the Constitution).","ah":"अनुच्छेद 32 (डॉ. आंबेडकर ने इसे संविधान की आत्मा कहा)।"},{"id":"p07","cat":"polity","q":"Fundamental Duties were added by which amendment?","qh":"मौलिक कर्तव्य किस संशोधन से जोड़े गए?","a":"42nd Amendment (1976), Part IVA, Article 51A.","ah":"42वाँ संशोधन (1976), भाग IVA, अनुच्छेद 51A।"},{"id":"p08","cat":"polity","q":"Minimum age: President / Rajya Sabha / Lok Sabha member?","qh":"न्यूनतम आयु: राष्ट्रपति / राज्यसभा / लोकसभा सदस्य?","a":"President 35 years, Rajya Sabha 30 years, Lok Sabha 25 years.","ah":"राष्ट्रपति 35 वर्ष, राज्यसभा 30 वर्ष, लोकसभा 25 वर्ष।"},{"id":"p09","cat":"polity","q":"Name the five writs.","qh":"पाँच रिट (लेख) के नाम बताइए।","a":"Habeas Corpus, Mandamus, Prohibition, Certiorari, Quo Warranto.","ah":"बंदी प्रत्यक्षीकरण, परमादेश, प्रतिषेध, उत्प्रेषण, अधिकार पृच्छा।"},{"id":"p10","cat":"polity","q":"Which amendment gave constitutional status to Panchayati Raj?","qh":"पंचायती राज को संवैधानिक दर्जा किस संशोधन से मिला?","a":"73rd Amendment (1992). Urban local bodies: 74th Amendment.","ah":"73वाँ संशोधन (1992)। नगर निकाय: 74वाँ संशोधन।"},{"id":"p11","cat":"polity","q":"The Anti-Defection Law is in which Schedule?","qh":"दल-बदल विरोधी कानून किस अनुसूची में है?","a":"10th Schedule (added by the 52nd Amendment, 1985).","ah":"10वीं अनुसूची (52वें संशोधन, 1985 से जुड़ी)।"},{"id":"p12","cat":"polity","q":"How many Fundamental Rights are there now? Which right was removed?","qh":"अब कितने मौलिक अधिकार हैं? कौन-सा अधिकार हटा?","a":"Six. Right to Property was removed by the 44th Amendment (1978); it is now a legal right under Article 300A.","ah":"छह। संपत्ति का अधिकार 44वें संशोधन (1978) से हटा; अब अनुच्छेद 300A में कानूनी अधिकार है।"},{"id":"p13","cat":"polity","q":"Which case gave the 'Basic Structure' doctrine?","qh":"'मूल ढाँचा' सिद्धांत किस केस से आया?","a":"Kesavananda Bharati case (1973).","ah":"केशवानंद भारती केस (1973)।"},{"id":"p14","cat":"polity","q":"Article 324 and Article 148 deal with?","qh":"अनुच्छेद 324 और 148 किससे संबंधित हैं?","a":"Article 324: Election Commission. Article 148: Comptroller and Auditor General (CAG).","ah":"अनुच्छेद 324: निर्वाचन आयोग। अनुच्छेद 148: नियंत्रक एवं महालेखा परीक्षक (CAG)।"},{"id":"g01","cat":"geo","q":"Largest and smallest Indian state by area?","qh":"क्षेत्रफल में सबसे बड़ा और सबसे छोटा राज्य?","a":"Largest: Rajasthan. Smallest: Goa.","ah":"सबसे बड़ा: राजस्थान। सबसे छोटा: गोवा।"},{"id":"g02","cat":"geo","q":"Longest river within India?","qh":"भारत के भीतर सबसे लंबी नदी?","a":"Ganga (about 2,525 km).","ah":"गंगा (लगभग 2,525 किमी)।"},{"id":"g03","cat":"geo","q":"Highest peak of India (within Indian territory)?","qh":"भारतीय क्षेत्र की सबसे ऊँची चोटी?","a":"Kangchenjunga (8,586 m), the third highest in the world.","ah":"कंचनजंगा (8,586 मी), विश्व की तीसरी सबसे ऊँची चोटी।"},{"id":"g04","cat":"geo","q":"How many Indian states does the Tropic of Cancer pass through?","qh":"कर्क रेखा भारत के कितने राज्यों से गुज़रती है?","a":"Eight: Gujarat, Rajasthan, Madhya Pradesh, Chhattisgarh, Jharkhand, West Bengal, Tripura, Mizoram.","ah":"आठ: गुजरात, राजस्थान, मध्य प्रदेश, छत्तीसगढ़, झारखंड, पश्चिम बंगाल, त्रिपुरा, मिज़ोरम।"},{"id":"g05","cat":"geo","q":"Standard Meridian of India?","qh":"भारत की मानक याम्योत्तर रेखा?","a":"82°30′ E, passing near Mirzapur (Uttar Pradesh). IST = UTC + 5:30.","ah":"82°30′ पूर्व, मिर्ज़ापुर (उत्तर प्रदेश) के पास से। IST = UTC + 5:30।"},{"id":"g06","cat":"geo","q":"Largest brackish-water lagoon in India?","qh":"भारत की सबसे बड़ी खारे पानी की लैगून झील?","a":"Chilika Lake (Odisha).","ah":"चिल्का झील (ओडिशा)।"},{"id":"g07","cat":"geo","q":"Which two big rivers flow west into the Arabian Sea through rift valleys?","qh":"कौन-सी दो बड़ी नदियाँ दरार घाटियों से पश्चिम में अरब सागर में गिरती हैं?","a":"Narmada and Tapi.","ah":"नर्मदा और तापी।"},{"id":"g08","cat":"geo","q":"'Dakshin Ganga' is the name of which river?","qh":"'दक्षिण गंगा' किस नदी को कहते हैं?","a":"Godavari.","ah":"गोदावरी।"},{"id":"g09","cat":"geo","q":"Highest peak of the Western Ghats?","qh":"पश्चिमी घाट की सबसे ऊँची चोटी?","a":"Anamudi (2,695 m), Kerala.","ah":"अनामुडी (2,695 मी), केरल।"},{"id":"g10","cat":"geo","q":"Which soil is best for cotton? Another name?","qh":"कपास के लिए सबसे अच्छी मिट्टी? दूसरा नाम?","a":"Black soil, also called Regur.","ah":"काली मिट्टी, जिसे रेगुर भी कहते हैं।"},{"id":"g11","cat":"geo","q":"Wettest place in India (Meghalaya)?","qh":"भारत का सबसे अधिक वर्षा वाला स्थान (मेघालय)?","a":"Mawsynram (Cherrapunji is nearby).","ah":"मौसिनराम (चेरापूंजी पास में है)।"},{"id":"g12","cat":"geo","q":"How many land neighbours does India have?","qh":"भारत के कितने स्थलीय पड़ोसी देश हैं?","a":"Seven: Pakistan, Afghanistan, China, Nepal, Bhutan, Bangladesh, Myanmar.","ah":"सात: पाकिस्तान, अफ़गानिस्तान, चीन, नेपाल, भूटान, बांग्लादेश, म्यांमार।"},{"id":"g13","cat":"geo","q":"Southernmost point of India?","qh":"भारत का सबसे दक्षिणी बिंदु?","a":"Indira Point (Great Nicobar Island).","ah":"इंदिरा पॉइंट (ग्रेट निकोबार द्वीप)।"},{"id":"g14","cat":"geo","q":"Oldest fold mountain range of India vs the youngest?","qh":"भारत की सबसे पुरानी और सबसे नई वलित पर्वतमाला?","a":"Oldest: Aravalli. Youngest: Himalaya.","ah":"सबसे पुरानी: अरावली। सबसे नई: हिमालय।"},{"id":"h01","cat":"history","q":"Battle of Plassey and Battle of Buxar - years?","qh":"प्लासी और बक्सर के युद्ध - वर्ष?","a":"Plassey: 1757. Buxar: 1764.","ah":"प्लासी: 1757। बक्सर: 1764।"},{"id":"h02","cat":"history","q":"Where and when did the Revolt of 1857 begin?","qh":"1857 की क्रांति कहाँ और कब शुरू हुई?","a":"Meerut, 10 May 1857.","ah":"मेरठ, 10 मई 1857।"},{"id":"h03","cat":"history","q":"Jallianwala Bagh massacre - date, place, officer?","qh":"जलियाँवाला बाग हत्याकांड - तारीख, स्थान, अधिकारी?","a":"13 April 1919, Amritsar; General Dyer.","ah":"13 अप्रैल 1919, अमृतसर; जनरल डायर।"},{"id":"h04","cat":"history","q":"Why was the Non-Cooperation Movement withdrawn?","qh":"असहयोग आंदोलन क्यों वापस लिया गया?","a":"After the Chauri Chaura incident (1922).","ah":"चौरी-चौरा कांड (1922) के बाद।"},{"id":"h05","cat":"history","q":"Dandi March - date and purpose?","qh":"दांडी मार्च - तारीख और उद्देश्य?","a":"12 March 1930; Salt Satyagraha against the salt law (Civil Disobedience Movement).","ah":"12 मार्च 1930; नमक कानून के विरोध में नमक सत्याग्रह (सविनय अवज्ञा आंदोलन)।"},{"id":"h06","cat":"history","q":"Quit India Movement - date and slogan?","qh":"भारत छोड़ो आंदोलन - तारीख और नारा?","a":"8 August 1942; 'Do or Die'.","ah":"8 अगस्त 1942; 'करो या मरो'।"},{"id":"h07","cat":"history","q":"Who founded the Indian National Congress and when? First president?","qh":"भारतीय राष्ट्रीय कांग्रेस की स्थापना किसने और कब की? पहले अध्यक्ष?","a":"A. O. Hume, 1885. First president: W. C. Bonnerjee.","ah":"ए. ओ. ह्यूम, 1885। पहले अध्यक्ष: डब्ल्यू. सी. बनर्जी।"},{"id":"h08","cat":"history","q":"Who partitioned Bengal and when?","qh":"बंगाल का विभाजन किसने और कब किया?","a":"Lord Curzon, 1905.","ah":"लॉर्ड कर्ज़न, 1905।"},{"id":"h09","cat":"history","q":"First Battle of Panipat - year and winner?","qh":"पानीपत का पहला युद्ध - वर्ष और विजेता?","a":"1526; Babur defeated Ibrahim Lodi.","ah":"1526; बाबर ने इब्राहीम लोदी को हराया।"},{"id":"h10","cat":"history","q":"Battle of Haldighati - year and fighters?","qh":"हल्दीघाटी का युद्ध - वर्ष और योद्धा?","a":"1576; Akbar's army (Man Singh) vs Maharana Pratap.","ah":"1576; अकबर की सेना (मान सिंह) बनाम महाराणा प्रताप।"},{"id":"h11","cat":"history","q":"Which war made Ashoka turn to Buddhism?","qh":"किस युद्ध के बाद अशोक ने बौद्ध धर्म अपनाया?","a":"The Kalinga War (about 261 BCE).","ah":"कलिंग युद्ध (लगभग 261 ईसा पूर्व)।"},{"id":"h12","cat":"history","q":"Which period is called the 'Golden Age' of ancient India?","qh":"प्राचीन भारत का 'स्वर्ण युग' किस काल को कहते हैं?","a":"The Gupta period.","ah":"गुप्त काल।"},{"id":"h13","cat":"history","q":"Famous structure of Mohenjo-daro?","qh":"मोहनजोदड़ो की प्रसिद्ध संरचना?","a":"The Great Bath.","ah":"विशाल स्नानागार (ग्रेट बाथ)।"},{"id":"h14","cat":"history","q":"First President of India and first PM of India?","qh":"भारत के पहले राष्ट्रपति और पहले प्रधानमंत्री?","a":"President: Dr. Rajendra Prasad. PM: Jawaharlal Nehru.","ah":"राष्ट्रपति: डॉ. राजेंद्र प्रसाद। प्रधानमंत्री: जवाहरलाल नेहरू।"},{"id":"s01","cat":"science","q":"SI units of force, energy, power, pressure?","qh":"बल, ऊर्जा, शक्ति, दाब की SI इकाइयाँ?","a":"Force: Newton. Energy/Work: Joule. Power: Watt. Pressure: Pascal.","ah":"बल: न्यूटन। ऊर्जा/कार्य: जूल। शक्ति: वाट। दाब: पास्कल।"},{"id":"s02","cat":"science","q":"Speed of light in vacuum?","qh":"निर्वात में प्रकाश की चाल?","a":"About 3 × 10⁸ m/s (3,00,000 km/s).","ah":"लगभग 3 × 10⁸ मी/से (3,00,000 किमी/से)।"},{"id":"s03","cat":"science","q":"Diseases from deficiency of Vitamin A, B1, C, D?","qh":"विटामिन A, B1, C, D की कमी से रोग?","a":"A: Night blindness. B1: Beriberi. C: Scurvy. D: Rickets.","ah":"A: रतौंधी। B1: बेरीबेरी। C: स्कर्वी। D: रिकेट्स।"},{"id":"s04","cat":"science","q":"Powerhouse of the cell?","qh":"कोशिका का ऊर्जा-घर?","a":"Mitochondria.","ah":"माइटोकॉन्ड्रिया।"},{"id":"s05","cat":"science","q":"Number of bones in an adult human body? Largest and smallest bone?","qh":"वयस्क शरीर में हड्डियाँ? सबसे बड़ी और सबसे छोटी हड्डी?","a":"206. Largest: femur (thigh). Smallest: stapes (ear).","ah":"206। सबसे बड़ी: फीमर (जाँघ)। सबसे छोटी: स्टेपीज़ (कान)।"},{"id":"s06","cat":"science","q":"Largest organ and largest gland of the human body?","qh":"मानव शरीर का सबसे बड़ा अंग और सबसे बड़ी ग्रंथि?","a":"Largest organ: skin. Largest gland: liver.","ah":"सबसे बड़ा अंग: त्वचा। सबसे बड़ी ग्रंथि: यकृत (लिवर)।"},{"id":"s07","cat":"science","q":"pH of pure water? Acid and base range?","qh":"शुद्ध जल का pH? अम्ल और क्षार की सीमा?","a":"7 (neutral). Below 7 acidic, above 7 basic.","ah":"7 (उदासीन)। 7 से कम अम्लीय, 7 से अधिक क्षारीय।"},{"id":"s08","cat":"science","q":"Chemical formulas: common salt, baking soda, bleaching powder?","qh":"रासायनिक सूत्र: नमक, खाने का सोडा, ब्लीचिंग पाउडर?","a":"NaCl, NaHCO₃, CaOCl₂.","ah":"NaCl, NaHCO₃, CaOCl₂।"},{"id":"s09","cat":"science","q":"Chemical name of Plaster of Paris?","qh":"प्लास्टर ऑफ पेरिस का रासायनिक नाम?","a":"Calcium sulphate hemihydrate (CaSO₄·½H₂O).","ah":"कैल्शियम सल्फेट हेमिहाइड्रेट (CaSO₄·½H₂O)।"},{"id":"s10","cat":"science","q":"Ohm's law?","qh":"ओम का नियम?","a":"V = I × R (voltage = current × resistance).","ah":"V = I × R (वोल्टेज = धारा × प्रतिरोध)।"},{"id":"s11","cat":"science","q":"Most abundant gas in the atmosphere? Lightest gas?","qh":"वायुमंडल में सबसे अधिक गैस? सबसे हल्की गैस?","a":"Most abundant: Nitrogen (about 78%). Lightest: Hydrogen.","ah":"सबसे अधिक: नाइट्रोजन (लगभग 78%)। सबसे हल्की: हाइड्रोजन।"},{"id":"s12","cat":"science","q":"Deficiency diseases: iron, iodine, calcium?","qh":"कमी से रोग: आयरन, आयोडीन, कैल्शियम?","a":"Iron: Anaemia. Iodine: Goitre. Calcium: weak bones / Osteoporosis.","ah":"आयरन: एनीमिया। आयोडीन: घेंघा। कैल्शियम: कमज़ोर हड्डियाँ / ऑस्टियोपोरोसिस।"},{"id":"s13","cat":"science","q":"Hardest natural substance?","qh":"सबसे कठोर प्राकृतिक पदार्थ?","a":"Diamond.","ah":"हीरा।"},{"id":"s14","cat":"science","q":"Normal human body temperature?","qh":"मानव शरीर का सामान्य तापमान?","a":"37 °C (98.6 °F).","ah":"37 °C (98.6 °F)।"},{"id":"e01","cat":"economy","q":"When was RBI established? Where is its headquarters?","qh":"RBI की स्थापना कब हुई? मुख्यालय कहाँ है?","a":"1 April 1935; headquarters in Mumbai (nationalised in 1949).","ah":"1 अप्रैल 1935; मुख्यालय मुंबई (1949 में राष्ट्रीयकृत)।"},{"id":"e02","cat":"economy","q":"What is the Repo Rate?","qh":"रेपो रेट क्या है?","a":"The rate at which RBI lends short-term money to commercial banks.","ah":"वह दर जिस पर RBI वाणिज्यिक बैंकों को अल्पकालिक ऋण देता है।"},{"id":"e03","cat":"economy","q":"When was GST implemented in India?","qh":"भारत में GST कब लागू हुआ?","a":"1 July 2017.","ah":"1 जुलाई 2017।"},{"id":"e04","cat":"economy","q":"NITI Aayog replaced which body and when?","qh":"नीति आयोग ने किसकी जगह ली और कब?","a":"Planning Commission; 1 January 2015.","ah":"योजना आयोग; 1 जनवरी 2015।"},{"id":"e05","cat":"economy","q":"Financial year in India?","qh":"भारत में वित्तीय वर्ष?","a":"1 April to 31 March.","ah":"1 अप्रैल से 31 मार्च।"},{"id":"e06","cat":"economy","q":"First Five Year Plan - period?","qh":"पहली पंचवर्षीय योजना - अवधि?","a":"1951-56.","ah":"1951-56।"},{"id":"e07","cat":"economy","q":"Who is the 'Father of the White Revolution' (Operation Flood)?","qh":"श्वेत क्रांति (ऑपरेशन फ्लड) के जनक?","a":"Dr. Verghese Kurien.","ah":"डॉ. वर्गीज़ कुरियन।"},{"id":"e08","cat":"economy","q":"Which Article deals with the Annual Financial Statement (Budget)?","qh":"वार्षिक वित्तीय विवरण (बजट) किस अनुच्छेद में है?","a":"Article 112.","ah":"अनुच्छेद 112।"},{"id":"m01","cat":"maths","q":"Area and circumference of a circle?","qh":"वृत्त का क्षेत्रफल और परिधि?","a":"Area = πr². Circumference = 2πr.","ah":"क्षेत्रफल = πr²। परिधि = 2πr।"},{"id":"m02","cat":"maths","q":"Area of a triangle (two formulas)?","qh":"त्रिभुज का क्षेत्रफल (दो सूत्र)?","a":"½ × base × height. Heron: √[s(s−a)(s−b)(s−c)], s = (a+b+c)/2.","ah":"½ × आधार × ऊँचाई। हेरोन: √[s(s−a)(s−b)(s−c)], s = (a+b+c)/2।"},{"id":"m03","cat":"maths","q":"Volume and curved surface area of a cylinder?","qh":"बेलन का आयतन और वक्र पृष्ठ क्षेत्रफल?","a":"Volume = πr²h. CSA = 2πrh.","ah":"आयतन = πr²h। वक्र पृष्ठ = 2πrh।"},{"id":"m04","cat":"maths","q":"Volume and surface area of a sphere?","qh":"गोले का आयतन और पृष्ठ क्षेत्रफल?","a":"Volume = 4/3 πr³. Surface area = 4πr².","ah":"आयतन = 4/3 πr³। पृष्ठ क्षेत्रफल = 4πr²।"},{"id":"m05","cat":"maths","q":"Volume of a cone?","qh":"शंकु का आयतन?","a":"1/3 × πr²h.","ah":"1/3 × πr²h।"},{"id":"m06","cat":"maths","q":"(a + b)² and a² − b²?","qh":"(a + b)² और a² − b²?","a":"(a+b)² = a² + 2ab + b². a² − b² = (a+b)(a−b).","ah":"(a+b)² = a² + 2ab + b²। a² − b² = (a+b)(a−b)।"},{"id":"m07","cat":"maths","q":"Simple Interest and Compound Amount?","qh":"साधारण ब्याज और चक्रवृद्धि मिश्रधन?","a":"SI = (P × R × T)/100. Amount = P(1 + R/100)ⁿ.","ah":"SI = (P × R × T)/100। मिश्रधन = P(1 + R/100)ⁿ।"},{"id":"m08","cat":"maths","q":"Convert km/h to m/s? Average speed for equal distances at speeds x and y?","qh":"किमी/घंटा से मी/से? बराबर दूरी पर चाल x और y हो तो औसत चाल?","a":"Multiply by 5/18. Average speed = 2xy/(x+y).","ah":"5/18 से गुणा करें। औसत चाल = 2xy/(x+y)।"},{"id":"m09","cat":"maths","q":"Profit % and selling price formula?","qh":"लाभ % और विक्रय मूल्य का सूत्र?","a":"Profit % = (Profit/CP) × 100. SP = CP × (100 + P%)/100.","ah":"लाभ % = (लाभ/क्रय मूल्य) × 100। SP = CP × (100 + P%)/100।"},{"id":"m10","cat":"maths","q":"Sum of first n natural numbers and of their squares?","qh":"पहली n प्राकृत संख्याओं का योग और उनके वर्गों का योग?","a":"n(n+1)/2 and n(n+1)(2n+1)/6.","ah":"n(n+1)/2 और n(n+1)(2n+1)/6।"},{"id":"m11","cat":"maths","q":"Roots of ax² + bx + c = 0?","qh":"ax² + bx + c = 0 के मूल?","a":"x = [−b ± √(b² − 4ac)] / 2a.","ah":"x = [−b ± √(b² − 4ac)] / 2a।"},{"id":"m12","cat":"maths","q":"nth term and sum of an AP?","qh":"AP का nवाँ पद और योग?","a":"aₙ = a + (n−1)d. Sₙ = n/2 × [2a + (n−1)d].","ah": async weekly(){const r=weeklyBuild(),mx=Math.max(1,...r.qpd),dn=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
 const delta=(c,p)=>p==0?(c>0?'<small style="color:#1b8a3a">New this week 🎉 / इस हफ़्ते नया</small>':''):(()=>{const x=Math.round((c-p)/p*100);return x>=0?`<small style="color:#1b8a3a">▲ ${x}% vs last week / पिछले हफ़्ते से</small>`:`<small style="color:#d22">▼ ${Math.abs(x)}% vs last week / पिछले हफ़्ते से</small>`})();
 const box=(t,v,sub)=>`<div class="card"><small class="mu">${t}</small><div style="font-size:22px;font-weight:800">${v}</div>${sub}</div>`;
 window.WKR=r;
 return wrap(back+`<h2 class="pageTitle">Weekly Report</h2><div class="card" style="text-align:center"><div class="mu">${esc(r.range)}</div><div style="font-size:48px;font-weight:800;color:var(--ac)">${r.score}/100</div><div style="font-size:20px">${r.emoji} ${esc(r.title)} / ${esc(r.titleHi)}</div><small class="mu">Weekly score = active days + study time + questions + tests<br>साप्ताहिक स्कोर = सक्रिय दिन + पढ़ाई का समय + सवाल + टेस्ट</small></div>
 <div class="card"><b>✅ Active days: ${r.activeDays}/7 / सक्रिय दिन</b><div class="row">${r.active.map((a,i)=>`<span style="width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:11px;${a?'background:var(--gold);font-weight:700':'background:var(--card2)'}">${dn[(r.dates[i].getDay()+6)%7].slice(0,2)}</span>`).join('')}</div></div>
 <div class="card"><b>🎯 Questions per day / रोज़ के सवाल</b><div class="bars">${r.qpd.map((n,i)=>`<div class="bc"><small>${n||''}</small><i style="height:${Math.max(4,n/mx*80)}px"></i><small>${dn[(r.dates[i].getDay()+6)%7]}</small></div>`).join('')}</div></div>
 <div class="grid">${box('Study time / पढ़ाई',fmtSec(r.focusSec),delta(r.focusSec,r.prevFocus))}${box('Questions / सवाल',r.questions,delta(r.questions,r.prevQ))}${box('Tests & quizzes / टेस्ट',r.tests,r.tests?`<small>Avg score ${Math.round(r.avgScore)}% · Accuracy ${Math.round(r.accuracy)}%</small>`:'<small class="mu">No test yet / अभी कोई टेस्ट नहीं</small>')}${box('Syllabus topics / टॉपिक',r.topics,'<small class="mu">Done this week / इस हफ़्ते पूरे</small>')}${box('Speed Maths / स्पीड मैथ्स',r.speedRounds,`<small class="mu">rounds${r.speedRounds?' · '+r.speedCorrect+' correct / सही':' / राउंड'}</small>`)}${box('Streak / स्ट्रीक',r.streak,'<small class="mu">days in a row / लगातार दिन</small>')}</div>`
 +(r.strong?`<div class="card"><b>📊 Subjects this week / इस हफ़्ते के विषय</b><div>💪 Strongest / सबसे मज़बूत: ${esc(r.strong)}</div><div>🎯 Needs work / सुधार चाहिए: ${esc(r.weak)}</div></div>`:'')

async plan(){const p=planBuild(),left=p.total-p.doneCount,go={quiz:'quiz',revision:'revision',goal:'fmcq',focus:'timer',syllabus:'syllabus',speed:'speed'};
 return wrap(back+`<h2 class="pageTitle">Today’s Plan / आज का प्लान</h2><div class="card"><div class="row" style="justify-content:space-between"><b style="font-size:22px">${p.doneCount}/${p.total}</b><span>🔥 ${streakNow()} day streak / दिन</span></div><div class="bar"><i style="width:${p.total?p.doneCount/p.total*100:0}%"></i></div>${p.daysLeft>=0?`<div>📅 ${p.daysLeft} days to ${esc(p.examName)}</div>`:''}<div class="mu">${p.doneCount>=p.total?'All done for today! 🎉 / आज का सब पूरा!':`${left} more to go — you are doing well!<br>बस ${left} और बाकी — बढ़िया चल रहा है!`}</div></div>`
 +p.tasks.map(t=>`<a class="card" href="#/${go[t.id]}" style="${t.done?'border-color:#1b8a3a;background:#e6f6ea':''}"><div class="row" style="justify-content:space-between"><b>${t.e} ${esc(t.t)} / ${esc(t.th)}</b><span style="font-size:20px">${t.done?'✅':'⬜'}</span></div><small class="mu">${esc(t.s)}<br>${esc(t.sh)}</small></a>`).join('')
 +`<p class="mu">Tasks tick automatically as you study. The plan resets every day.<br>पढ़ाई करते ही टास्क अपने आप टिक हो जाते हैं। प्लान रोज़ नया बनता है।</p>`)},

function initTest(){const s=T;window.QS=window.QS||{};QS.mt=s.Q;s.ans=Array(s.Q.length).fill(null);s.left=s.t.durationMinutes?s.t.durationMinutes*60:0;
 drawTest();updTimer();
 timers.push(setInterval(()=>{if(T.done)return;if(T.t.durationMinutes){T.left--;updTimer();if(T.left<=0)submitTest()}else updTimer()},1000))}
const fmtT=x=>`${Math.floor(x/60)}:${String(x%60).padStart(2,'0')}`;
function updTimer(){const e=document.getElementById('mtime');if(!e)return;e.textContent='⏱ '+fmtT(T.t.durationMinutes?Math.max(0,T.left):Math.floor((Date.now()-T.start)/1000))}
function drawTest(){const s=T,Q=s.Q,q=Q[s.i],hi=s.hi,mp=s.t.marksPerQuestion||1,ng=s.t.negativeMarks||0;
 if(s.done)return;
 const answered=s.ans.filter(a=>a!==null).length,sv=J.get('bookmarks',[]);
 const opts=hi&&q.optionsHi?.length?q.optionsHi:q.options;
 document.getElementById('mtest').innerHTML=`<div class="mtop"><span id="mtime" class="mtime"></span>
 <button class="s" onclick="togglePal()" title="Questions"><span class="material-icons">grid_view</span></button>
 <button class="s" onclick="toggleLang()">${hi?'English':'हिंदी'}</button>
 <button class="p" onclick="confirmSubmit()">Submit</button></div>
 <div class="row mu" style="justify-content:space-between"><span>Q ${s.i+1} / ${Q.length}</span><span>+${mp}${ng?' / −'+ng:''} · Answered ${answered}/${Q.length}</span></div>
 ${s.pal?`<div class="pal"><b>Jump to question</b> <small class="mu">Green = answered</small><div class="pgrid">${Q.map((_,k)=>`<button class="pn ${s.ans[k]!==null?'ans':''} ${k==s.i?'cur':''}" onclick="jumpTo(${k})">${k+1}</button>`).join('')}</div></div>`:''}
 <div class="q">${q.passage?`<div class="passage">${esc(qt(q,'passage',hi))}</div>`:''}
 <div class="row" style="justify-content:space-between"><span class="mu">Question ${s.i+1}</span><button class="s" onclick="bm('mt',${s.i},this)">${sv.some(x=>x.text===q.text)?'★ Saved':'☆ Save'}</button></div>
 <div class="qtext">${esc(qt(q,'text',hi))}</div>
 ${opts.map((o,j)=>`<div class="opt ${s.ans[s.i]==j?'sel':''}" onclick="pickAns(${j})"><span class="badge">${'ABCD'[j]}</span><span>${esc(o)}</span></div>`).join('')}
 </div>
 <div class="mbar"><button class="s" onclick="stepQ(-1)" ${s.i==0?'disabled':''}>Previous</button><button class="s" onclick="clearAns()">Clear</button>${s.i<Q.length-1?'<button class="p" onclick="stepQ(1)">Next</button>':'<button class="p" onclick="confirmSubmit()">Submit</button>'}</div>`}
function pickAns(j){T.ans[T.i]=j;drawTest()}
function clearAns(){T.ans[T.i]=null;drawTest()}
function stepQ(d){T.i=Math.min(Math.max(0,T.i+d),T.Q.length-1);drawTest();scrollTo(0,0)}
function jumpTo(k){T.i=k;T.pal=false;drawTest();scrollTo(0,0)}
function togglePal(){T.pal=!T.pal;drawTest()}
function toggleLang(){lang=lang=='hi'?'en':'hi';T.hi=lang=='hi';drawTest()}
function confirmSubmit(){if(T.done)return;const un=T.ans.filter(a=>a===null).length;if(confirm(un?`${un} questions abhi unanswered hain. Submit karein?`:'Test submit karein?'))submitTest()}

async function admGrant(email,bid,months){
 email=String(email).trim().toLowerCase();if(months===undefined||months===null)months=admDefault(bid);
 const id=email+'_'+bid,code=String(100000+Math.floor(Math.random()*900000));
 const exp=months>0?addMonthsEnd(new Date(),months):null;
 try{
  await db.collection('batchAccess').doc(id).set({studentEmail:email,batchId:bid,status:'granted',accessCode:code,grantedAt:firebase.firestore.FieldValue.serverTimestamp(),grantedBy:'admin',validityMonths:months,expiresAt:exp?firebase.firestore.Timestamp.fromDate(exp):null});
  await db.collection('accessRequests').doc(id).delete().catch(()=>{});
  alert('Access granted!\nAccess code: '+code+'\n'+(exp?'Valid till '+exp.toLocaleDateString('en-IN'):'Lifetime access')+'\n\nYe code student ko bhej dein.');
  route();
 }catch(e){alert('Grant nahi hua: '+e.message)}
}

 <div class="grid"><div class="card"><small class="mu">Accuracy<br>सटीकता</small><div style="font-size:22px;font-weight:800">${acc}%</div></div><div class="card"><small class="mu">Wrong<br>गलत</small><div style="font-size:22px;font-weight:800">${SM.wrong}</div></div><div class="card"><small class="mu">Sec / question<br>सेकंड / सवाल</small><div style="font-size:22px;font-weight:800">${per}</div></div></div>
 <div class="row" style="justify-content:center"><button class="p" onclick="smReset();smCount()">Play again / फिर खेलें</button><button class="s" onclick="smShare()">Share score / स्कोर शेयर करें</button><button class="s" onclick="history.back()">Back to drills / ड्रिल पर वापस</button></div>`}
function smShare(){const a=SM.correct+SM.wrong,acc=a?Math.round(SM.correct*100/a):0,i=SM.info;const txt=SM.rapid?`⚡ ${i.en}: ${SM.correct} correct in 60 seconds (${acc}% accuracy). Can you beat me?\nमैंने 60 सेकंड में ${SM.correct} सही किए। क्या आप मुझे हरा सकते हैं?`:`⚡ ${i.en}: ${SM.correct}/20 correct in ${SM.secs}s (${acc}% accuracy). Can you beat me?\nमैंने 20 में से ${SM.correct} सवाल ${SM.secs} सेकंड में सही किए। क्या आप मुझे हरा सकते हैं?`;
 if(navigator.share)navigator.share({text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>alert('Score copy ho gaya, ab kahin bhi paste karein.'),()=>alert(txt));else alert(txt)}
function submitTest(){if(!T||T.done)return;clearT();const s=T,t=s.t,Q=s.Q,hi=s.hi;s.done=true;
 const mp=t.marksPerQuestion||1,ng=t.negativeMarks||0;let c=0,w=0,m=0;
 Q.forEach((q,i)=>{const a=s.ans[i];if(a!==null){if(a==q.correctIndex){c++;m+=mp}else{w++;m-=ng}}});
 const total=+(Q.length*mp).toFixed(2),marks=+m.toFixed(2),skipped=Q.length-c-w,sub=(t.subject||'').trim();
 const h=J.get('history',[]);h.unshift({title:t.title,subject:sub,marks,maxMarks:total,correct:c,wrong:w,skipped,at:Date.now()});J.set('history',h.slice(0,60));
 addMistakes(Q.filter((q,i)=>s.ans[i]!==null&&s.ans[i]!=q.correctIndex),sub,t.title);
 addGoal(c+w);lifeTest(c,w,marks,total);saveAttempt(t,s.id,marks,total,s.ans);
 const review=Q.map((q,i)=>{const a=s.ans[i];const opts=hi&&q.optionsHi?.length?q.optionsHi:q.options;const ex=hi&&q.explanationHi||q.explanation;
  return `<div class="q"><b>${i+1}. ${esc(qt(q,'text',hi))}</b>${opts.map((o,j)=>`<div class="opt ${j==q.correctIndex?'okb':''} ${a==j&&j!=q.correctIndex?'nob':''}"><span class="badge">${'ABCD'[j]}</span><span>${esc(o)}</span></div>`).join('')}${a===null?'<small class="mu">Skipped</small>':''}${ex?`<p class="mu">💡 ${esc(ex)}</p>`:''}</div>`}).join('');
 document.getElementById('mtest').innerHTML=`<div class="q"><h2>Score: ${marks} / ${total}</h2>✅ ${c} · ❌ ${w} · ⏭ ${skipped}</div>${s.id?`<a class="card" href="#/board/${s.id}">🏆 Leaderboard</a>`:''}<h2 class="pageTitle">Review / समीक्षा</h2>${review}`;
 scrollTo(0,0)}

function initHome(){
 const trk=document.getElementById('trk');
 if(trk){const dots=[...document.querySelectorAll('.dots i')];const cur=()=>Math.round(trk.scrollLeft/trk.clientWidth);
  trk.onscroll=()=>dots.forEach((d,k)=>d.classList.toggle('on',k==cur()));
  trk.onclick=e=>{const im=e.target.closest('img');if(!im)return;if(im.dataset.b)location.hash='#/batch/'+im.dataset.b;else if(im.dataset.l)window.open(im.dataset.l,'_blank','noopener')};
  if(dots.length>1)timers.push(setInterval(()=>trk.scrollTo({left:((cur()+1)%dots.length)*trk.clientWidth,behavior:'smooth'}),4000))}
 const socs=[{t:'Official Telegram',s:'Instant updates & PDFs',c:'Join',col:'#229ED9',i:'✈️',u:cfg.telegramUrl},{t:'Official WhatsApp',s:'Fastest notifications',c:'Follow',col:'#25D366',i:'💬',u:cfg.whatsappUrl},{t:'Official YouTube',s:'Free live classes',c:'Sub',col:'#FF0000',i:'▶️',u:cfg.youtubeUrl},{t:'Official Instagram',s:'Daily updates & reels',c:'Follow',col:'#B5177F',i:'📸',u:'https://www.instagram.com/yash_study_hub'},{t:'Official Facebook',s:'Join our community',c:'Like',col:'#1259B8',i:'f',u:'https://www.facebook.com/YashStudyHub'}];
 let k=0;const el=document.getElementById('soc');
 const draw=()=>{const x=socs[k];el.href=x.u;el.target='_blank';el.rel='noopener';el.style.background=x.col+'1a';el.style.borderColor=x.col+'66';
  el.innerHTML=`<span class="av" style="background:${x.col}">${x.i}</span><span class="t"><b>${esc(x.t)}</b><small>${esc(x.s)}</small></span><span class="cta" style="background:${x.col}">${x.c}</span>`};
 draw();timers.push(setInterval(()=>{k=(k+1)%socs.length;draw()},3000));
}

 clearT();
 if(window.TM&&TM.running)tmPause();

 if(!V[p]){location.hash='#/home';return}
 app.innerHTML='<p class="mu" style="padding:16px">Loading…</p>';

 try{
