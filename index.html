function touchStreak(){const st=J.get('streak',{last:'',count:0}),t=dayKey(),y=dayKey(new Date(Date.now()-DAY));
 if(st.last!==t){st.count=st.last===y?st.count+1:1;st.last=t;J.set('streak',st)}return st.count}

 return `<div class="card study"><div><span class="material-icons" style="color:#e65100">local_fire_department</span> <b>${s} din ka streak</b></div>

}

function grade(Q,prefix,mp,ng,hi){let s=0,c=0,w=0;const ans=[];
 Q.forEach((q,i)=>{const r=document.querySelector(`input[name=${prefix}${i}]:checked`),a=r?+r.value:null;ans.push(a);

 ${s.pal?`<div class="pal"><b>Jump to question</b> <small class="mu">Green = answered</small><div class="pgrid">${Q.map((_,k)=>`<button class="pn ${s.ans[k]!==null?'ans':''} ${k==s.i?'cur':''}" onclick="jumpTo(${k})">${k+1}</button>`).join('')}</div></div>`:''}
 <div class="q">${q.passage?`<div class="passage">${esc(qt(q,'passage',hi))}</div>`:''}
 <div class="row" style="justify-content:space-between"><span class="mu">Question ${s.i+1}</span><button class="s" onclick="bm('mt',${s.i},this)">${sv.some(x=>x.text===q.text)?'★ Saved':'☆ Save'}</button></div>
 <div class="qtext">${esc(qt(q,'text',hi))}</div>
 ${opts.map((o,j)=>`<div class="opt ${s.ans[s.i]==j?'sel':''}" onclick="pickAns(${j})"><span class="badge">${'ABCD'[j]}</span><span>${esc(o)}</span></div>`).join('')}
 </div>

 const q=s.Q[s.i],hi=s.hi,opts=hi&&q.optionsHi?.length==4?q.optionsHi:q.options,sv=J.get('bookmarks',[]),p=s.picked,ex=(hi&&q.explanationHi)||q.explanation;

 <div class="q">${q.passage?`<div class="passage">${esc(qt(q,'passage',hi))}</div>`:''}<div class="qtext">${esc(qt(q,'text',hi))}</div>
 ${opts.map((o,j)=>`<div class="opt ${p!==null&&j==q.correctIndex?'okb':''} ${p===j&&j!=q.correctIndex?'nob':''}" onclick="fqPick(${j})"><span class="badge">${'ABCD'[j]}</span><span>${esc(o)}${p===j?(j==q.correctIndex?' ✓':' ✗'):''}</span></div>`).join('')}

function fqNext(){const s=FQ;if(s.i<s.Q.length-1){s.i++;s.picked=null;drawFq();scrollTo(0,0);return}
 s.done=true;const wrong=[];let answered=0,correct=0;
 s.Q.forEach((q,i)=>{const a=s.ans[i];if(a===null)return;answered++;if(a==q.correctIndex)correct++;else wrong.push(q)});
 const d=J.get('fmDone',{});d[s.m.id]=correct+'/'+s.Q.length;J.set('fmDone',d);
 addMistakes(wrong,s.subject,s.exam+' · '+fmMonth(s.m.monthKey));addGoal(answered);drawFq();scrollTo(0,0)}
const GOALS=[25,35,50,75,100];
function goalVal(){const v=J.get('goal',null);if(v==null)return 25;if(GOALS.includes(v))return v;return GOALS.reduce((b,o)=>Math.abs(o-v)<Math.abs(b-v)?o:b,GOALS[0])}

function contactHtml(){const L=[['✈️','Telegram','#229ED9',cfg.telegramUrl],['💬','WhatsApp','#25D366',cfg.whatsappUrl],['📸','Instagram','#B5177F','https://www.instagram.com/yash_study_hub'],['f','Facebook','#1259B8','https://www.facebook.com/YashStudyHub'],['✉️','Mail','#FF9800','mailto:officialteamysh@gmail.com']];
 return `<div class="sec" style="justify-content:center">Contact and Join Us</div><div class="socrow">${L.map(l=>`<a href="${esc(l[3])}" target="_blank" rel="noopener"><span class="sb" style="background:${l[2]}">${l[0]}</span><small>${l[1]}</small></a>`).join('')}</div>`}

function submitTest(){if(!T||T.done)return;clearT();const s=T,t=s.t,Q=s.Q,hi=s.hi;s.done=true;
 const mp=t.marksPerQuestion||1,ng=t.negativeMarks||0;let c=0,w=0,m=0;
 Q.forEach((q,i)=>{const a=s.ans[i];if(a!==null){if(a==q.correctIndex){c++;m+=mp}else{w++;m-=ng}}});
 const total=+(Q.length*mp).toFixed(2),marks=+m.toFixed(2),skipped=Q.length-c-w,sub=(t.subject||'').trim();
 const h=J.get('history',[]);h.unshift({title:t.title,subject:sub,marks,maxMarks:total,correct:c,wrong:w,skipped,at:Date.now()});J.set('history',h.slice(0,60));
 addMistakes(Q.filter((q,i)=>s.ans[i]!==null&&s.ans[i]!=q.correctIndex),sub,t.title);
 addGoal(c+w);saveAttempt(t,s.id,marks,total,s.ans);
 const review=Q.map((q,i)=>{const a=s.ans[i];const opts=hi&&q.optionsHi?.length?q.optionsHi:q.options;const ex=hi&&q.explanationHi||q.explanation;
  return `<div class="q"><b>${i+1}. ${esc(qt(q,'text',hi))}</b>${opts.map((o,j)=>`<div class="opt ${j==q.correctIndex?'okb':''} ${a==j&&j!=q.correctIndex?'nob':''}"><span class="badge">${'ABCD'[j]}</span><span>${esc(o)}</span></div>`).join('')}${a===null?'<small class="mu">Skipped</small>':''}${ex?`<p class="mu">💡 ${esc(ex)}</p>`:''}</div>`}).join('');
 document.getElementById('mtest').innerHTML=`<div class="q"><h2>Score: ${marks} / ${total}</h2>✅ ${c} · ❌ ${w} · ⏭ ${skipped}</div>${s.id?`<a class="card" href="#/board/${s.id}">🏆 Leaderboard</a>`:''}<h2 class="pageTitle">Review / समीक्षा</h2>${review}`;
 scrollTo(0,0)}

function submitQuiz(){const{day,Q}=window.QZ;const hi=lang=='hi';const r=grade(Q,'z',1,0,hi);
 const done=J.get('quizDone',{});
 if(!done[day]){done[day]={score:r.c,total:Q.length};J.set('quizDone',done);addGoal(r.c+r.w)}
 document.getElementById('res').innerHTML=`<div class="q"><h2>Score: ${r.c} / ${Q.length}</h2>${done[day].score==r.c&&done[day].total==Q.length?'':'<p class="mu">Pehla prayas hi count hota hai.</p>'}</div>`;scrollTo(0,document.body.scrollHeight)}

function initHome(){
 const trk=document.getElementById('trk');
 if(trk){const dots=[...document.querySelectorAll('.dots i')];const cur=()=>Math.round(trk.scrollLeft/trk.clientWidth);
  trk.onscroll=()=>dots.forEach((d,k)=>d.classList.toggle('on',k==cur()));
  trk.onclick=e=>{const im=e.target.closest('img');if(!im)return;if(im.dataset.b)location.hash='#/batch/'+im.dataset.b;else if(im.dataset.l)window.open(im.dataset.l,'_blank','noopener')};
  if(dots.length>1)timers.push(setInterval(()=>trk.scrollTo({left:((cur()+1)%dots.length)*trk.clientWidth,behavior:'smooth'}),4000))}
 const socs=[{t:'Official Telegram',s:'Instant updates & PDFs',c:'Join',col:'#229ED9',i:'✈️',u:cfg.telegramUrl},{t:'Official WhatsApp',s:'Fastest notifications',c:'Follow',col:'#25D366',i:'💬',u:cfg.whatsappUrl},{t:'Official YouTube',s:'Free live classes',c:'Sub',col:'#FF0000',i:'▶️',u:cfg.youtubeUrl},{t:'Official Instagram',s:'Daily updates & reels',c:'Follow',col:'#B5177F',i:'📸',u:'https://www.instagram.com/yash_study_hub'},{t:'Official Facebook',s:'Join our community',c:'Like',col:'#1259B8',i:'f',u:'https://www.facebook.com/YashStudyHub'}];
 let k=0;const el=document.getElementById('soc');
 const draw=()=>{const x=socs[k];el.href=x.u;el.target='_blank';el.rel='noopener';el.style.background=x.col+'1a';el.style.borderColor=x.col+'66';
  el.innerHTML=`<span class="av" style="background:${x.col}">${x.i}</span><span class="t"><b>${esc(x.t)}</b><small>${esc(x.s)}</small></span><span class="cta" style="background:${x.col}">${x.c}</span>`};
 draw();timers.push(setInterval(()=>{k=(k+1)%socs.length;draw()},3000));
}

function showNav(p){
 const side=document.getElementById('side'),bn=document.getElementById('bn');
 if(p===null){side.innerHTML='';side.style.display='none';bn.style.display='none';return}
 side.style.display='';
 const items=BN.map(b=>`<a href="#/${b[0]}" class="${p==b[0]?'on':''}"><span class="material-icons">${b[1]}</span>${b[2]}</a>`).join('');
 side.innerHTML=`<div class="brand"><img src="logo.png" alt=""><div>${esc(cfg.appName)}<small>${esc(cfg.tagline)}</small></div></div>`+items;
 bn.style.display='flex';bn.innerHTML=items;
}

async function route(){
 clearT();
 const[p,a,b]=(location.hash.slice(2)||'home').split('/');
 if(!V[p]){location.hash='#/home';return}
 app.innerHTML='<p class="mu" style="padding:16px">Loading…</p>';
 showNav(p);
 try{
  const body=await V[p](a,b);
  app.innerHTML=(p=='home'?'':topBar())+body;
  if(p=='home')initHome();
  checkBell();
  if(p=='test')initTest();
  if(p=='fmq')initFq();
 }catch(e){app.innerHTML=topBar()+'<div class="wrap"><p class="err">Load nahi hua: '+esc(e.message)+'</p></div>'}
 scrollTo(0,0)}

 if(!location.hash)location.hash='#/home';
 route()});
</script></body></html>
